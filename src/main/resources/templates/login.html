<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Đăng nhập - Reelcry</title>

    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="apple-touch-icon" th:href="@{/images/icon-192.png}">

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-mark.svg}">
    <link rel="stylesheet" th:href="@{/css/login.css(v=6)}">
    <link rel="stylesheet" th:href="@{/css/modern.css(v=1)}">
    <script>
        // Trang đăng nhập không có header (chưa đăng nhập) nên không có nút
        // bấm đổi giao diện ở đây, nhưng vẫn tôn trọng lựa chọn sáng/tối đã
        // lưu từ trước để nhất quán với phần còn lại của web.
        (function () {
            try {
                if (localStorage.getItem('reelcry-theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) { }
        })();
    </script>
</head>
<body>

<div class="login-glow login-glow-1"></div>
<div class="login-glow login-glow-2"></div>
<div class="login-grain"></div>

<a href="/" class="login-back"><i class="fas fa-chevron-left"></i> Về trang chủ</a>

<div class="login-card">
    <img class="login-logo-mark" th:src="@{/images/logo-mark.svg}" alt="" width="64" height="64">
    <div class="login-logo">REEL<span class="login-logo-accent">CRY</span></div>
    <div class="login-subtitle">Đăng nhập để tiếp tục xem phim</div>

    <div class="alert-box" th:if="${param.error}">
        <i class="fas fa-circle-exclamation"></i> Sai tên đăng nhập hoặc mật khẩu.
    </div>
    <div class="alert-box success" th:if="${param.logout}">
        <i class="fas fa-circle-check"></i> Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label class="form-label">Tên đăng nhập</label>
    <div class="input-icon-group">
        <i class="fas fa-user input-icon"></i>
        <input type="text" name="username" class="form-control-custom" placeholder="Nhập tên đăng nhập" required autofocus>
    </div>

    <label class="form-label">Mật khẩu</label>
    <div class="input-icon-group">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" name="password" id="loginPassword" class="form-control-custom" placeholder="Nhập mật khẩu" required>
        <button type="button" class="input-icon-toggle" id="togglePasswordBtn" aria-label="Hiện/ẩn mật khẩu" tabindex="-1">
            <i class="fas fa-eye"></i>
        </button>
    </div>

    <label class="form-remember">
        <input type="checkbox" name="remember-me" checked>
        <span class="form-remember-check"><i class="fas fa-check"></i></span>
        Ghi nhớ đăng nhập
    </label>

    <button type="submit" class="btn-login">
        <i class="fas fa-right-to-bracket me-2"></i> Đăng nhập
    </button>
</form>
</div>

<script>
    (function () {
        var toggle = document.getElementById('togglePasswordBtn');
        var pwd = document.getElementById('loginPassword');
        if (!toggle || !pwd) return;
        toggle.addEventListener('click', function () {
            var isHidden = pwd.type === 'password';
            pwd.type = isHidden ? 'text' : 'password';
            toggle.querySelector('i').classList.toggle('fa-eye', !isHidden);
            toggle.querySelector('i').classList.toggle('fa-eye-slash', isHidden);
        });
    })();
</script>

</body>
</html>
