<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="reelcry-header">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6G8P923RSQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-6G8P923RSQ');
    </script>

    <link rel="stylesheet" th:href="@{/css/reelcry-header.css(v=7)}">

    <div class="page-loading-bar" id="pageLoadingBar"></div>

    <nav class="navbar navbar-dark sticky-top navbar-custom" id="reelcryNavbar">
        <div class="container-fluid px-lg-4">
            <div class="yt-left">
                <button class="yt-hamburger" type="button" data-bs-toggle="offcanvas" data-bs-target="#reelcrySidebar"
                    aria-controls="reelcrySidebar" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <a class="navbar-brand navbar-brand-custom" href="/">
                    
                    REELCRY
                </a>
            </div>

            <div class="yt-search-area">
                <form action="/search" method="get" class="search-wrap">
                    <input class="form-control search-input" type="search" name="keyword"
                        placeholder="Tìm tên phim...">
                    
                    <button class="search-btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
                <button type="button" class="yt-mic-btn" id="voiceSearchBtn" title="Giữ để nói"
                    style="display:none; touch-action: none;">
                    <i class="fa-solid fa-microphone"></i>
                    <span class="voice-status-label" id="voiceStatusLabel">
                        <span class="voice-wave"><span></span><span></span><span></span><span></span></span>
                        <span class="voice-status-dot"></span>
                        <span id="voiceStatusText"></span>
                    </span>
                </button>
            </div>

            <div class="yt-right">
                
                <div class="dropdown">
                    <button type="button" class="yt-avatar-btn" data-bs-toggle="dropdown" aria-expanded="false"
                        title="Tài khoản">
                        <i class="fa-solid fa-user"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end yt-account-menu">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit">
                                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar trượt ra từ trái, giống YouTube -->
    <div class="offcanvas offcanvas-start yt-sidebar" tabindex="-1" id="reelcrySidebar"
        aria-labelledby="reelcrySidebarLabel">
        <div class="offcanvas-body">
            <a class="yt-side-item" href="/">
                <span class="yt-side-icon-wrap c-red"><i class="fa-solid fa-house"></i></span> Trang chủ
            </a>
            <a class="yt-side-item" href="/filter/danh-sach/phim-moi-cap-nhat">
                <span class="yt-side-icon-wrap c-red"><i class="fa-solid fa-clock-rotate-left"></i></span> Phim mới
            </a>

            <div class="yt-side-divider"></div>
            <div class="yt-side-section-title">Thể loại</div>

            <div class="yt-chip-wrap">
                <a class="yt-chip" th:each="g, iter : ${allGenres}" th:if="${iter.index < 10}"
                    th:href="@{/filter/the-loai/{slug}(slug=${g.slug})}" th:text="${g.name}"></a>
            </div>
            <button class="yt-chip yt-chip-more" type="button" data-bs-toggle="collapse" data-bs-target="#genresMore"
                aria-expanded="false" aria-controls="genresMore" th:if="${allGenres != null and allGenres.size() > 10}">
                Thêm <i class="fa-solid fa-chevron-down yt-side-chevron"></i>
            </button>
            <div class="collapse" id="genresMore">
                <div class="yt-chip-wrap mt-2">
                    <a class="yt-chip" th:each="g, iter : ${allGenres}" th:if="${iter.index >= 10}"
                        th:href="@{/filter/the-loai/{slug}(slug=${g.slug})}" th:text="${g.name}"></a>
                </div>
            </div>

            <div class="yt-side-divider"></div>
            <div class="yt-side-section-title">Quốc gia</div>

            <div class="yt-chip-wrap">
                <a class="yt-chip yt-chip-blue" th:each="c, iter : ${allCountries}" th:if="${iter.index < 10}"
                    th:href="@{/filter/quoc-gia/{slug}(slug=${c.slug})}" th:text="${c.name}"></a>
            </div>
            <button class="yt-chip yt-chip-more" type="button" data-bs-toggle="collapse" data-bs-target="#countriesMore"
                aria-expanded="false" aria-controls="countriesMore"
                th:if="${allCountries != null and allCountries.size() > 10}">
                Thêm <i class="fa-solid fa-chevron-down yt-side-chevron"></i>
            </button>
            <div class="collapse" id="countriesMore">
                <div class="yt-chip-wrap mt-2">
                    <a class="yt-chip yt-chip-blue" th:each="c, iter : ${allCountries}" th:if="${iter.index >= 10}"
                        th:href="@{/filter/quoc-gia/{slug}(slug=${c.slug})}" th:text="${c.name}"></a>
                </div>
            </div>
        </div>
    </div>

    <button type="button" class="back-to-top-btn" id="backToTopBtn" aria-label="Quay lại đầu trang">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Thanh điều hướng dưới cùng cho điện thoại - dễ bấm 1 tay hơn menu hamburger -->
    <nav class="yt-bottom-nav" id="reelcryBottomNav">
        <a href="/" class="bn-item" data-bn="home">
            <i class="fa-solid fa-house"></i>
            <span>Trang chủ</span>
        </a>
        <button type="button" class="bn-item" id="bnSearchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Tìm kiếm</span>
        </button>
        <a href="/#watched-section" class="bn-item" data-bn="watched">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Đã xem</span>
        </a>
        <a href="/#favorites-section" class="bn-item" data-bn="favorites">
            <i class="fa-solid fa-heart"></i>
            <span>Yêu thích</span>
        </a>
        <button type="button" class="bn-item" data-bs-toggle="offcanvas" data-bs-target="#reelcrySidebar"
            aria-controls="reelcrySidebar">
            <i class="fa-solid fa-bars"></i>
            <span>Menu</span>
        </button>
    </nav>

    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === 'F5' || e.keyCode === 116) {
                e.preventDefault();
                window.location.href = '/';
            }
        });

        (function () {
            var btn = document.getElementById('backToTopBtn');
            if (!btn) return;

            function toggleBtn() {
                if (window.scrollY > 400) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            }

            window.addEventListener('scroll', toggleBtn, { passive: true });
            toggleBtn();

            btn.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        })();

        // Thanh điều hướng dưới cùng (bottom nav) trên điện thoại
        (function () {
            var nav = document.getElementById('reelcryBottomNav');
            if (!nav) return;

            var path = window.location.pathname;
            nav.querySelectorAll('.bn-item[data-bn]').forEach(function (el) {
                if (el.getAttribute('data-bn') === 'home' && path === '/') {
                    el.classList.add('active');
                }
            });

            var searchBtn = document.getElementById('bnSearchBtn');
            if (searchBtn) {
                searchBtn.addEventListener('click', function () {
                    // Phải gọi focus() ngay lập tức, đồng bộ trong sự kiện click
                    // (không qua setTimeout) thì bàn phím ảo trên di động (đặc
                    // biệt Safari/iOS) mới tự bật lên - nếu trì hoãn, trình
                    // duyệt không còn coi đó là hành động trực tiếp của người
                    // dùng nên sẽ chỉ focus (viền đỏ) mà không hiện bàn phím.
                    var input = document.querySelector('.search-input');
                    if (input) input.focus({ preventScroll: true });
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
        })();

        (function () {
            var sidebar = document.getElementById('reelcrySidebar');
            if (!sidebar) return;

            function stagger(container) {
                var items = container.querySelectorAll(':scope > *');
                items.forEach(function (el, i) {
                    el.style.animationDelay = (i * 25) + 'ms';
                });
            }

            sidebar.addEventListener('show.bs.offcanvas', function () {
                sidebar.classList.remove('yt-anim-in');
                void sidebar.offsetWidth;
                sidebar.classList.add('yt-anim-in');
                stagger(sidebar.querySelector('.offcanvas-body'));
            });

            sidebar.querySelectorAll('.collapse').forEach(function (col) {
                col.addEventListener('show.bs.collapse', function () {
                    sidebar.classList.add('yt-anim-in');
                    stagger(col);
                });
            });
        })();

        // Thanh loading kiểu YouTube: chạy khi bấm link/submit form chuyển
        // trang (điều hướng full page reload), giúp bớt cảm giác "web treo"
        // lúc server phản hồi chậm (cold start, API ngoài chậm...)
        (function () {
            var bar = document.getElementById('pageLoadingBar');
            if (!bar) return;

            var safetyTimeout = null;

            function resetBar() {
                if (safetyTimeout) {
                    clearTimeout(safetyTimeout);
                    safetyTimeout = null;
                }
                bar.classList.remove('active');
                bar.classList.remove('done');
                bar.style.width = '0%';
            }

            function startBar() {
                bar.classList.remove('done');
                bar.style.width = '0%';
                void bar.offsetWidth;
                bar.classList.add('active');
                bar.style.width = '85%';

                // Lưới an toàn: nếu vì lý do gì đó trang không chuyển (VD: 1 nút
                // vô tình chặn sự kiện click), thanh loading sẽ tự ẩn sau vài
                // giây thay vì kẹt lại mãi trên màn hình trông rất xấu.
                if (safetyTimeout) clearTimeout(safetyTimeout);
                safetyTimeout = setTimeout(resetBar, 4000);
            }

            document.addEventListener('click', function (e) {
                var link = e.target.closest('a[href]');
                if (!link) return;
                if (link.target && link.target !== '' && link.target !== '_self') return;
                if (link.hasAttribute('download')) return;
                if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;

                var href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;

                try {
                    var url = new URL(href, window.location.href);
                    if (url.origin !== window.location.origin) return;
                } catch (err) {
                    return;
                }

                startBar();
            });

            document.addEventListener('submit', function (e) {
                if (e.target && e.target.tagName === 'FORM') startBar();
            });

            window.addEventListener('pageshow', function (event) {
                // event.persisted = true khi tải lại từ bfcache (bấm Back/Forward)
                resetBar();
            });
        })();

        // Đăng ký Service Worker để hỗ trợ PWA (thêm ra màn hình chính, cache
        // CSS/ảnh tĩnh khi mất mạng tạm thời). Không cache HTML động.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function (e) {
                    console.error('Reelcry SW register error', e);
                });
            });
        }

        // Tìm kiếm bằng giọng nói (Web Speech API) - chỉ hiện nút mic nếu
        // trình duyệt hỗ trợ (Chrome/Edge trên Android & desktop; Safari/iOS
        // và Firefox hiện chưa hỗ trợ đầy đủ nên nút sẽ tự ẩn ở đó)
        (function () {
            var micBtn = document.getElementById('voiceSearchBtn');
            var searchInput = document.querySelector('.search-input');
            var searchForm = searchInput ? searchInput.closest('form') : null;
            var statusLabel = document.getElementById('voiceStatusLabel');
            var statusText = document.getElementById('voiceStatusText');
            if (!micBtn || !searchInput || !searchForm) return;

            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            micBtn.style.display = '';
            micBtn.title = 'Giữ để nói';

            var recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            var isListening = false;
            var pressActive = false; // đang giữ nút (chuột hoặc chạm)
            var touchActive = false; // vừa xử lý touch, bỏ qua mouse "ma" theo sau
            var hideLabelTimeout = null;

            function showLabel(text, state) {
                if (hideLabelTimeout) {
                    clearTimeout(hideLabelTimeout);
                    hideLabelTimeout = null;
                }
                if (statusText) statusText.textContent = text;
                if (statusLabel) {
                    statusLabel.classList.remove('recording', 'stopped');
                    statusLabel.classList.add('show', state);
                }
            }

            function hideLabelAfter(ms) {
                if (hideLabelTimeout) clearTimeout(hideLabelTimeout);
                hideLabelTimeout = setTimeout(function () {
                    if (statusLabel) statusLabel.classList.remove('show');
                }, ms);
            }

            // Phát tiếng "bíp" ngắn bằng Web Audio API - không cần file âm thanh
            function playBeep(freq, durationMs, volume) {
                try {
                    var AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    var ctx = new AudioCtx();
                    var oscillator = ctx.createOscillator();
                    var gainNode = ctx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.value = freq;
                    gainNode.gain.setValueAtTime(volume, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durationMs / 1000);
                    oscillator.start();
                    oscillator.stop(ctx.currentTime + durationMs / 1000);
                    oscillator.onended = function () { ctx.close(); };
                } catch (e) {
                    console.error('Reelcry beep error', e);
                }
            }

            function beepStart() { playBeep(880, 110, 0.18); }
            function beepStop() { playBeep(440, 130, 0.16); }

            // ---- Cơ chế "giữ để nói" (push-to-talk): nhấn giữ nút mic để thu,
            // thả tay ra để dừng - giống bộ đàm ----
            function pressStart(e) {
                if (e.type === 'touchstart') {
                    touchActive = true;
                } else if (e.type === 'mousedown' && touchActive) {
                    return; // bỏ qua sự kiện chuột "ma" phát sinh sau touch trên mobile
                }
                if (e.cancelable) e.preventDefault();

                if (pressActive || isListening) return;
                pressActive = true;
                try {
                    recognition.start();
                } catch (err) {
                    console.error('Reelcry voice search start error', err);
                    pressActive = false;
                }
            }

            function pressEnd(e) {
                if (e && e.type === 'mouseup' && touchActive) {
                    touchActive = false;
                    return;
                }
                if (!pressActive) return;
                pressActive = false;
                if (isListening) recognition.stop();
            }

            micBtn.addEventListener('touchstart', pressStart, { passive: false });
            micBtn.addEventListener('touchend', pressEnd);
            micBtn.addEventListener('touchcancel', pressEnd);
            micBtn.addEventListener('mousedown', pressStart);
            micBtn.addEventListener('mouseup', pressEnd);
            micBtn.addEventListener('mouseleave', function (e) {
                if (pressActive) pressEnd(e);
            });

            recognition.addEventListener('start', function () {
                isListening = true;
                micBtn.classList.add('listening');
                showLabel('Đang nghe...', 'recording');
                beepStart();
            });

            recognition.addEventListener('end', function () {
                isListening = false;
                pressActive = false;
                micBtn.classList.remove('listening');
                showLabel('Đã dừng', 'stopped');
                hideLabelAfter(1200);
                beepStop();
            });

            recognition.addEventListener('result', function (event) {
                var transcript = event.results[0][0].transcript;
                if (transcript && transcript.trim()) {
                    searchInput.value = transcript.trim();
                    searchForm.submit();
                }
            });

            recognition.addEventListener('error', function (event) {
                console.error('Reelcry voice search error', event.error);
                isListening = false;
                pressActive = false;
                micBtn.classList.remove('listening');
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    showLabel('Không có quyền micro', 'stopped');
                    hideLabelAfter(2000);
                    alert('Vui lòng cho phép quyền truy cập micro để dùng tìm kiếm bằng giọng nói.');
                } else if (event.error === 'no-speech') {
                    showLabel('Không nghe thấy gì', 'stopped');
                    hideLabelAfter(1500);
                } else if (event.error !== 'aborted') {
                    showLabel('Có lỗi xảy ra', 'stopped');
                    hideLabelAfter(1500);
                }
            });
        })();
    </script>
</div>

</html>
