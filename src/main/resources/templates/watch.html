<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title th:text="'Đang xem: ' + ${movie.name} + ' - Reelcry'"></title>

  <link rel="manifest" th:href="@{/manifest.json}">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="apple-touch-icon" th:href="@{/images/icon-192.png}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" th:href="@{/css/watch.css(v=3)}">
</head>

<body th:attr="data-movie-image=@{/img-proxy(url=${movie?.getPosterFull()})}">
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>
  <div id="light-overlay" onclick="toggleLights()"></div>

  <div th:replace="~{header :: reelcry-header}"></div>

  <div class="container my-4">

    <div class="source-switcher d-flex align-items-center mb-3 flex-wrap gap-3">
      <span class="section-label"><i class="fas fa-database me-2"></i>Nguồn API:</span>
      <div class="btn-group">
        <a th:href="@{/xem-phim/{slug}(slug=${movie.slug}, ep=${currentEpSlug}, src='ophim')}"
          th:classappend="${currentSource == 'ophim' || currentSource == null} ? 'btn-danger' : 'btn-outline-secondary'"
          class="btn btn-src px-3 shadow-none">Server 1 (OPhim)</a>

        <a th:href="@{/xem-phim/{slug}(slug=${movie.slug}, ep=${currentEpSlug}, src='kkphim')}"
          th:classappend="${currentSource == 'kkphim'} ? 'btn-danger' : 'btn-outline-secondary'"
          class="btn btn-src px-3 shadow-none">Server 2 (KKPhim - Quốc Tế)</a>
      </div>
      <small class="text-secondary d-none d-md-inline"><i class="fas fa-info-circle me-1"></i>Ưu tiên <b>Server 2</b>
        nếu bạn ở nước ngoài.</small>
    </div>

    <div class="video-container" id="main-player">
      <div class="player-ratio">
        <iframe th:src="${currentLink}" allowfullscreen></iframe>
        <div class="resume-toast" id="resume-toast" th:if="${resumeElapsedSeconds != null}">
          <i class="fas fa-clock-rotate-left toast-icon"></i>
          <span>Lần trước bạn xem đến khoảng <b id="resume-toast-time"></b></span>
          <button type="button" class="btn-close-toast" onclick="dismissResumeToast()">&times;</button>
        </div>
        <div class="server-fallback-toast" id="server-fallback-toast">
          <i class="fas fa-triangle-exclamation toast-icon"></i>
          <span>Video không phát được?</span>
          <a class="btn-switch-server"
            th:href="@{/xem-phim/{slug}(slug=${movie.slug}, ep=${currentEpSlug}, sv=0, src=${currentSource == 'kkphim' ? 'ophim' : 'kkphim'})}">
            Đổi sang <span th:text="${currentSource == 'kkphim' ? 'Server 1' : 'Server 2'}"></span>
          </a>
          <button type="button" class="btn-close-toast" onclick="dismissServerToast()">&times;</button>
        </div>
      </div>
    </div>

    <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h1 class="movie-title-watch mb-1" th:text="${movie.name}"></h1>
        <p class="text-secondary small mb-0"><i class="fas fa-play-circle text-danger me-2"></i> Đang xem tập: <span
            th:text="${currentEpSlug}"></span></p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-light-toggle rounded-pill px-3" onclick="toggleLights()">
          <i class="fas fa-lightbulb me-2"></i> <span id="light-text">Tắt đèn</span>
        </button>
        <button class="btn btn-dark border-secondary rounded-pill px-3" onclick="shareMovie()">
          <i class="fas fa-share-alt me-2"></i>Chia sẻ
        </button>
        <button class="btn btn-outline-danger rounded-pill px-4" id="btn-like" onclick="likeEffect(event)">
          <i class="fas fa-heart"></i>
        </button>
      </div>
    </div>

    <hr class="my-4 border-secondary opacity-25">

    <div class="row g-4">
      <div class="col-12 col-lg-4">
        <div class="control-box">
          <p class="section-label mb-3"><i class="fas fa-language me-2"></i>Chọn Server Ngôn ngữ</p>
          <div class="d-flex flex-column gap-2">
            <a th:each="sv, iter : ${movie.episodes}"
              th:href="@{/xem-phim/{slug}(slug=${movie.slug}, ep=${currentEpSlug}, sv=${iter.index}, src=${currentSource != null ? currentSource : 'ophim'})}"
              class="btn-custom w-100 justify-content-start"
              th:classappend="${selectedSv == iter.index} ? 'active' : ''">
              <i class="fas fa-headset me-3 small"></i>
              <span th:text="${sv.server_name}"></span>
            </a>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-8">
        <div class="control-box">
          <p class="section-label mb-3"><i class="fas fa-th-large me-2"></i>Danh sách tập</p>
          <div class="episode-grid">
            <a th:each="epItem : ${currentServer.server_data}"
              th:href="@{/xem-phim/{slug}(slug=${movie.slug}, ep=${epItem.slug}, sv=${selectedSv}, src=${currentSource != null ? currentSource : 'ophim'})}"
              class="btn-custom ep-btn" th:data-slug="${epItem.slug}"
              th:classappend="${currentEpSlug == epItem.slug} ? 'active' : ''" th:text="${epItem.name}">
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    function toggleLights() {
      const overlay = document.getElementById('light-overlay');
      const player = document.getElementById('main-player');
      const btn = document.querySelector('.btn-light-toggle');
      const text = document.getElementById('light-text');

      if (overlay.style.display === 'none' || overlay.style.display === '') {
        overlay.style.display = 'block';
        player.classList.add('lighting-off-active');
        btn.classList.add('active');
        text.innerText = 'Bật đèn';
        window.scrollTo({ top: player.offsetTop - 50, behavior: 'smooth' });
      } else {
        overlay.style.display = 'none';
        player.classList.remove('lighting-off-active');
        btn.classList.remove('active');
        text.innerText = 'Tắt đèn';
      }
    }

    function likeEffect(e) {
      for (let i = 0; i < 10; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.innerHTML = ['❤️', '💖', '🔥', '⭐'][Math.floor(Math.random() * 4)];
        heart.style.left = (e.clientX + (Math.random() - 0.5) * 50) + 'px';
        heart.style.top = (e.clientY + (Math.random() - 0.5) * 50) + 'px';
        heart.style.fontSize = (Math.random() * 10 + 15) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
      }
      document.getElementById('btn-like').classList.toggle('btn-danger');
      document.getElementById('btn-like').classList.toggle('text-white');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Gợi ý đổi server: nếu người dùng bấm vào khung video (focus chuyển vào iframe)
      // thì coi như video đã load được, không hiện thông báo nữa. Không có cách nào
      // đọc trực tiếp được nội dung iframe (khác domain) nên đây là suy đoán tốt nhất có thể.
      var playerFrame = document.querySelector('#main-player iframe');
      var iframeInteracted = false;
      var startCounting = null; // gán hàm thật bên dưới, sau khi elapsedSeconds được khởi tạo

      window.addEventListener('blur', function () {
        if (document.activeElement === playerFrame) {
          iframeInteracted = true;
          if (startCounting) startCounting();
        }
      });

      setTimeout(function () {
        if (iframeInteracted) return;
        var toast = document.getElementById('server-fallback-toast');
        if (toast) toast.classList.add('show');
      }, 9000);

      // Phòng trường hợp player tự chạy (autoplay) không cần bấm vào khung
      // video - vẫn bắt đầu đếm sau vài giây dù không phát hiện tương tác.
      setTimeout(function () {
        if (startCounting) startCounting();
      }, 5000);

      const movieSlug = [[${ movie.slug }]];
      const movieName = [[${ movie.name }]];
      const movieImage = document.body.dataset.movieImage;
    const currentEp = [[${ currentEpSlug }]];
    const allEpSlugs = [[${ currentServer.server_data.![slug] }]];
    const selectedSv = [[${ selectedSv }]];
    const currentSource = [[${ currentSource }]] || 'ophim';
    const resumeElapsedSeconds = [[${ resumeElapsedSeconds }]] || 0;
    let watched = JSON.parse(localStorage.getItem('watched_' + movieSlug) || "[]");

    if (!watched.includes(currentEp)) {
      watched.push(currentEp);
      localStorage.setItem('watched_' + movieSlug, JSON.stringify(watched));
    }

    document.querySelectorAll('.ep-btn').forEach(btn => {
      if (watched.includes(btn.getAttribute('data-slug'))) {
        btn.classList.add('watched');
      }
    });

    const idx = allEpSlugs.indexOf(currentEp);
    const total = allEpSlugs.length;
    const isSeries = total > 1;
    const progress = (isSeries && idx >= 0) ? Math.round(((idx + 1) / total) * 100) : null;
    const episodeLabel = (isSeries && idx >= 0) ? ('Tập ' + (idx + 1) + '/' + total) : '';

    function formatElapsed(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);
      const mm = (h > 0 ? String(m).padStart(2, '0') : String(m));
      const ss = String(s).padStart(2, '0');
      return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
    }

    // Nhắc lại lần trước đã xem đến khoảng phút nào (tính bằng thời gian mở
    // trang, không phải mốc thật trong video vì trình phát là iframe bên thứ
    // 3 không đọc được) - dữ liệu lưu theo tài khoản trên MongoDB nên đồng bộ
    // được giữa các thiết bị.
    if (resumeElapsedSeconds > 0) {
      var resumeToast = document.getElementById('resume-toast');
      var resumeTimeEl = document.getElementById('resume-toast-time');
      if (resumeToast && resumeTimeEl) {
        resumeTimeEl.textContent = formatElapsed(resumeElapsedSeconds);
        setTimeout(function () { resumeToast.classList.add('show'); }, 600);
      }
    }

    // Đếm thời gian đã xem tập này (ước lượng theo thời gian mở trang, chỉ
    // tính khi tab đang hiển thị) rồi định kỳ lưu lên server để lần sau nhắc lại.
    // Chỉ bắt đầu đếm khi người dùng đã bấm vào video (hoặc sau 5s coi như
    // player tự chạy) - tránh tính oan lúc mở tab nhưng chưa xem.
    let elapsedSeconds = resumeElapsedSeconds;
    let tickTimer = null;
    startCounting = function () {
      if (tickTimer) return; // đã bắt đầu rồi, không chạy lại
      tickTimer = setInterval(function () {
        if (document.visibilityState === 'visible') elapsedSeconds += 1;
      }, 1000);
    };

    function saveHistory(useBeacon) {
      var payload = JSON.stringify({
        slug: movieSlug,
        name: movieName,
        image: movieImage,
        episodeLabel: episodeLabel,
        progress: progress,
        epSlug: currentEp,
        sv: selectedSv,
        source: currentSource,
        elapsedSeconds: Math.round(elapsedSeconds)
      });

      if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon('/api/history', new Blob([payload], { type: 'application/json' }));
        return;
      }

      fetch('/api/history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      }).catch(function (e) {
        console.error('Reelcry history save error', e);
      });
    }

    saveHistory(false);
    setInterval(function () { saveHistory(false); }, 20000);

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') saveHistory(true);
    });
    window.addEventListener('pagehide', function () { saveHistory(true); });
    });

    function dismissServerToast() {
      var toast = document.getElementById('server-fallback-toast');
      if (toast) toast.classList.remove('show');
    }

    function dismissResumeToast() {
      var toast = document.getElementById('resume-toast');
      if (toast) toast.classList.remove('show');
    }

    function shareMovie() {
      alert("Đã sao chép link phim! Gửi cho bạn bè xem cùng nhé 🎬");
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
