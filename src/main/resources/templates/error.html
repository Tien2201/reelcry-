<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Có lỗi xảy ra - Reelcry</title>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/error.css(v=2)}">
</head>
<body>

    <div class="error-card">
        <div class="error-icon"><i class="fas fa-circle-exclamation"></i></div>
        <div class="error-code" th:text="${status} ?: '!'"></div>
        <div class="error-title">Có lỗi xảy ra</div>
        <div class="error-desc">
            Yêu cầu của bạn không thể thực hiện được lúc này.<br>
            Thử quay lại trang chủ hoặc thử lại sau nhé.
        </div>
        <div class="error-actions">
            <a href="/" class="btn-error"><i class="fas fa-house"></i> Về trang chủ</a>
        </div>
    </div>

</body>
</html>
