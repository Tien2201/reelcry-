<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dead Night</title>
<style>
  html,body{margin:0;height:100%;background:#050608;overflow:hidden;touch-action:none;
    font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#e8e2d0;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(20,4,4,.55),rgba(0,0,0,.92));z-index:5}
  #overlay.hidden{display:none}
  .panel{text-align:center;padding:24px;max-width:520px}
  h1{font-size:clamp(42px,9vw,78px);margin:0 0 6px;letter-spacing:6px;color:#c9261b;
    text-shadow:0 0 18px rgba(201,38,27,.6),0 4px 0 #3a0705;font-weight:900}
  .sub{opacity:.75;margin:0 0 22px;letter-spacing:2px}
  button{background:#c9261b;color:#fff;border:0;padding:14px 38px;font-size:18px;font-weight:800;
    letter-spacing:3px;border-radius:4px;cursor:pointer;box-shadow:0 0 22px rgba(201,38,27,.45)}
  button:hover{background:#e0332a}
  .help{margin-top:22px;font-size:14px;line-height:1.8;opacity:.7}
  .stats{font-size:18px;line-height:1.9;margin-bottom:20px}
  .stats b{color:#f2c14e}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script>
(() => {
'use strict';
// ================== SETUP ==================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const light = document.createElement('canvas');
const lctx = light.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = light.width = W * DPR;
  cv.height = light.height = H * DPR;
}
addEventListener('resize', resize); resize();

const WORLD = 2400;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ================== SOUND ==================
let ac = null, noiseBuf = null;
function initAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function noise(dur, freq, vol, q = 1) {
  if (!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + dur);
}
function tone(type, f1, f2, dur, vol) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  pistol: () => { noise(0.18, 2600, 0.5); tone('square', 160, 50, 0.08, 0.15); },
  shotgun: () => { noise(0.4, 1500, 0.8); tone('square', 110, 35, 0.15, 0.25); },
  smg: () => { noise(0.09, 3200, 0.3); },
  empty: () => tone('square', 900, 700, 0.04, 0.06),
  reload: () => { tone('square', 500, 300, 0.05, 0.08); setTimeout(() => tone('square', 700, 900, 0.05, 0.08), 180); },
  hit: () => noise(0.08, 600, 0.25),
  hurt: () => tone('sawtooth', 140, 60, 0.25, 0.25),
  groan: () => { if (!ac) return; const f = rand(60, 95); tone('sawtooth', f, f * 0.7, rand(0.5, 0.9), 0.05); },
  pickup: () => { tone('sine', 600, 1200, 0.12, 0.15); },
};

// ================== INPUT ==================
const keys = {};
const mouse = { x: 0, y: 0, down: false };
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!state.running) return;
  if (e.code === 'KeyR') reload();
  if (e.code === 'Digit1') switchWeapon(0);
  if (e.code === 'Digit2') switchWeapon(1);
  if (e.code === 'Digit3') switchWeapon(2);
  if (e.code === 'KeyQ') cycleWeapon();
  if (e.code === 'KeyP' || e.code === 'Escape') state.paused = !state.paused;
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => { initAudio(); if (e.button === 0) mouse.down = true; });
addEventListener('mouseup', () => mouse.down = false);
cv.addEventListener('wheel', e => { if (state.running) cycleWeapon(); }, { passive: true });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { mouse.down = false; for (const k in keys) keys[k] = false; });

// touch: left half = move stick, right half = aim/fire stick, buttons top-right
const sticks = { move: null, aim: null };
function touchButtons() {
  const s = 58, m = 16;
  return [
    { id: 'reload', x: W - m - s, y: H - 250, r: s / 2, label: 'R' },
    { id: 'swap', x: W - m - s * 2.2, y: H - 300, r: s / 2, label: '⇄' },
    { id: 'pause', x: W - 34, y: 34, r: 20, label: 'II' },
  ];
}
function onTouchStart(e) {
  initAudio(); e.preventDefault();
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (state.running) {
      const b = touchButtons().find(b => Math.hypot(b.x - x, b.y - y) < b.r + 10);
      if (b) { if (b.id === 'reload') reload(); else if (b.id === 'swap') cycleWeapon(); else state.paused = !state.paused; continue; }
    }
    const st = { id: t.identifier, ox: x, oy: y, x, y };
    if (x < W / 2) { if (!sticks.move) sticks.move = st; }
    else if (!sticks.aim) sticks.aim = st;
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches)
    for (const k of ['move', 'aim']) if (sticks[k] && sticks[k].id === t.identifier) { sticks[k].x = t.clientX; sticks[k].y = t.clientY; }
}
function onTouchEnd(e) {
  for (const t of e.changedTouches)
    for (const k of ['move', 'aim']) if (sticks[k] && sticks[k].id === t.identifier) sticks[k] = null;
}
cv.addEventListener('touchstart', onTouchStart, { passive: false });
cv.addEventListener('touchmove', onTouchMove, { passive: false });
cv.addEventListener('touchend', onTouchEnd);
cv.addEventListener('touchcancel', onTouchEnd);
function stickVec(st, max = 60) {
  if (!st) return { x: 0, y: 0, m: 0 };
  let dx = st.x - st.ox, dy = st.y - st.oy; const d = Math.hypot(dx, dy);
  if (d > max) { st.ox = st.x - dx / d * max; st.oy = st.y - dy / d * max; dx = dx / d * max; dy = dy / d * max; }
  const m = Math.min(d, max) / max;
  return d < 4 ? { x: 0, y: 0, m: 0 } : { x: dx / Math.min(d, max), y: dy / Math.min(d, max), m };
}

// ================== WORLD GENERATION ==================
const ground = document.createElement('canvas');
ground.width = ground.height = WORLD;
const gctx = ground.getContext('2d');
let obstacles = [], trees = [];

function genWorld() {
  obstacles = []; trees = [];
  // base asphalt / dirt
  gctx.fillStyle = '#2b2d29'; gctx.fillRect(0, 0, WORLD, WORLD);
  // grass / dirt patches
  for (let i = 0; i < 140; i++) {
    const x = rand(0, WORLD), y = rand(0, WORLD), r = rand(60, 220);
    const g = gctx.createRadialGradient(x, y, 0, x, y, r);
    const c = Math.random() < 0.6 ? '58,70,40' : '70,58,42';
    g.addColorStop(0, `rgba(${c},0.55)`); g.addColorStop(1, `rgba(${c},0)`);
    gctx.fillStyle = g; gctx.beginPath(); gctx.arc(x, y, r, 0, TAU); gctx.fill();
  }
  // roads
  gctx.fillStyle = '#1f2020';
  const roadsH = [600, 1500], roadsV = [800, 1700];
  for (const y of roadsH) gctx.fillRect(0, y - 90, WORLD, 180);
  for (const x of roadsV) gctx.fillRect(x - 90, 0, 180, WORLD);
  gctx.fillStyle = 'rgba(210,180,60,.55)';
  for (const y of roadsH) for (let x = 0; x < WORLD; x += 80) gctx.fillRect(x, y - 3, 44, 6);
  for (const x of roadsV) for (let y = 0; y < WORLD; y += 80) gctx.fillRect(x - 3, y, 6, 44);
  // grain noise
  for (let i = 0; i < 90000; i++) {
    const v = Math.random();
    gctx.fillStyle = v < 0.5 ? `rgba(0,0,0,${rand(0.05, 0.25)})` : `rgba(255,255,255,${rand(0.02, 0.07)})`;
    gctx.fillRect(Math.random() * WORLD, Math.random() * WORLD, rand(1, 3), rand(1, 3));
  }
  // cracks
  gctx.strokeStyle = 'rgba(0,0,0,.45)'; gctx.lineWidth = 1.5;
  for (let i = 0; i < 160; i++) {
    let x = rand(0, WORLD), y = rand(0, WORLD), a = rand(0, TAU);
    gctx.beginPath(); gctx.moveTo(x, y);
    for (let j = 0; j < 7; j++) { a += rand(-0.8, 0.8); x += Math.cos(a) * rand(8, 25); y += Math.sin(a) * rand(8, 25); gctx.lineTo(x, y); }
    gctx.stroke();
  }
  // old dried blood stains
  for (let i = 0; i < 40; i++) splat(rand(0, WORLD), rand(0, WORLD), rand(10, 30), '60,10,8', 0.5);

  const free = (x, y, w, h, pad = 40) => {
    if (Math.abs(x + w / 2 - WORLD / 2) < 220 && Math.abs(y + h / 2 - WORLD / 2) < 220) return false;
    return !obstacles.some(o => x < o.x + o.w + pad && x + w + pad > o.x && y < o.y + o.h + pad && y + h + pad > o.y);
  };
  // buildings (off-road)
  for (let i = 0, n = 0; i < 400 && n < 14; i++) {
    const w = rand(180, 320), h = rand(160, 300), x = rand(60, WORLD - w - 60), y = rand(60, WORLD - h - 60);
    const onRoad = roadsH.some(r => y < r + 110 && y + h > r - 110) || roadsV.some(r => x < r + 110 && x + w > r - 110);
    if (!onRoad && free(x, y, w, h, 120)) {
      obstacles.push({ type: 'building', x, y, w, h, hue: Math.floor(rand(0, 4)) }); n++;
    }
  }
  // cars, mostly on roads
  for (let i = 0, n = 0; i < 600 && n < 26; i++) {
    const horiz = Math.random() < 0.5;
    const w = horiz ? 96 : 48, h = horiz ? 48 : 96;
    let x, y;
    if (horiz) { x = rand(40, WORLD - 140); y = roadsH[n % 2] + rand(-80, 30); }
    else { x = roadsV[n % 2] + rand(-80, 30); y = rand(40, WORLD - 140); }
    if (Math.random() < 0.25) { x = rand(40, WORLD - 140); y = rand(40, WORLD - 140); }
    if (free(x, y, w, h)) {
      obstacles.push({ type: 'car', x, y, w, h, horiz, color: ['#6b1d1a', '#2a3f5a', '#5d5d58', '#3a4a2a', '#7a6a3a', '#1c1c1c'][n % 6], wreck: Math.random() < 0.4 }); n++;
    }
  }
  // crates & barriers
  for (let i = 0, n = 0; i < 600 && n < 40; i++) {
    const big = Math.random() < 0.5;
    const w = big ? 44 : 30, h = big ? 44 : 30, x = rand(40, WORLD - 80), y = rand(40, WORLD - 80);
    if (free(x, y, w, h, 30)) { obstacles.push({ type: Math.random() < 0.3 ? 'barrel' : 'crate', x, y, w, h, rot: rand(-0.15, 0.15) }); n++; }
  }
  for (let i = 0, n = 0; i < 400 && n < 12; i++) {
    const horiz = Math.random() < 0.5, w = horiz ? 120 : 26, h = horiz ? 26 : 120, x = rand(60, WORLD - 180), y = rand(60, WORLD - 180);
    if (free(x, y, w, h, 50)) { obstacles.push({ type: 'barrier', x, y, w, h }); n++; }
  }
  // trees (trunk collides, canopy drawn on top)
  for (let i = 0, n = 0; i < 600 && n < 45; i++) {
    const x = rand(60, WORLD - 60), y = rand(60, WORLD - 60), r = rand(50, 85);
    if (free(x - 10, y - 10, 20, 20, 60) && !trees.some(t => Math.hypot(t.x - x, t.y - y) < 110)) {
      trees.push({ x, y, r, seed: Math.random() * 1000 });
      obstacles.push({ type: 'trunk', x: x - 9, y: y - 9, w: 18, h: 18 }); n++;
    }
  }
}

// ================== GAME STATE ==================
const WEAPONS = [
  { name: 'SÚNG LỤC', dmg: 34, rate: 0.26, mag: 12, reload: 1.0, spread: 0.035, pellets: 1, speed: 1300, kick: 2, len: 16, infinite: true, snd: 'pistol', shake: 2 },
  { name: 'SHOTGUN', dmg: 20, rate: 0.75, mag: 6, reload: 1.6, spread: 0.24, pellets: 8, speed: 1100, kick: 8, len: 26, snd: 'shotgun', shake: 7, unlock: 2 },
  { name: 'TIỂU LIÊN', dmg: 17, rate: 0.075, mag: 32, reload: 1.4, spread: 0.08, pellets: 1, speed: 1400, kick: 1.5, len: 24, snd: 'smg', shake: 1.6, unlock: 4 },
];
const state = { running: false, paused: false };
let player, zombies, bullets, particles, pickups, floaters, cam, wave, toSpawn, spawnTimer, intermission, kills, score, shake, time, msg, flash, hurtFlash, groanTimer;

function newGame() {
  genWorld();
  player = {
    x: WORLD / 2, y: WORLD / 2, r: 15, a: 0, hp: 100, maxHp: 100, stamina: 1, speed: 190,
    weapon: 0, cooldown: 0, reloading: 0, walk: 0, recoil: 0, invuln: 0,
    guns: WEAPONS.map((w, i) => ({ owned: i === 0, ammo: w.mag, reserve: i === 0 ? Infinity : 0 })),
  };
  zombies = []; bullets = []; particles = []; pickups = []; floaters = [];
  cam = { x: player.x, y: player.y };
  wave = 0; kills = 0; score = 0; shake = 0; time = 0; flash = 0; hurtFlash = 0; groanTimer = 2;
  msg = null;
  nextWave();
}
function nextWave() {
  wave++;
  toSpawn = 6 + wave * 4;
  spawnTimer = 1.5;
  intermission = 0;
  showMsg(`ĐÊM ${wave}`, 'Sống sót qua đợt zombie này');
  WEAPONS.forEach((w, i) => {
    if (w.unlock === wave && !player.guns[i].owned) {
      player.guns[i].owned = true; player.guns[i].reserve = w.mag * 3;
      setTimeout(() => showMsg('VŨ KHÍ MỚI', `${w.name} — bấm ${i + 1}${isTouch ? ' / ⇄' : ''}`), 2200);
    }
  });
}
function showMsg(title, sub) { msg = { title, sub, t: 2.4 }; }

// ================== HELPERS ==================
function circleRect(c, o) {
  const nx = clamp(c.x, o.x, o.x + o.w), ny = clamp(c.y, o.y, o.y + o.h);
  const dx = c.x - nx, dy = c.y - ny, d2 = dx * dx + dy * dy;
  if (d2 < c.r * c.r) {
    if (d2 === 0) { // center inside rect: push out the nearest side
      const l = c.x - o.x, r = o.x + o.w - c.x, t = c.y - o.y, b = o.y + o.h - c.y, m = Math.min(l, r, t, b);
      if (m === l) c.x = o.x - c.r; else if (m === r) c.x = o.x + o.w + c.r; else if (m === t) c.y = o.y - c.r; else c.y = o.y + o.h + c.r;
      return true;
    }
    const d = Math.sqrt(d2), p = c.r - d;
    c.x += dx / d * p; c.y += dy / d * p;
    return true;
  }
  return false;
}
function collideWorld(c) {
  let hit = false;
  for (const o of obstacles) if (Math.abs(c.x - (o.x + o.w / 2)) < o.w / 2 + c.r + 2 && Math.abs(c.y - (o.y + o.h / 2)) < o.h / 2 + c.r + 2) hit = circleRect(c, o) || hit;
  c.x = clamp(c.x, c.r, WORLD - c.r); c.y = clamp(c.y, c.r, WORLD - c.r);
  return hit;
}
function pointInObstacle(x, y) {
  for (const o of obstacles) if (x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h) return o;
  return null;
}
function splat(x, y, size, rgb = '120,8,6', alpha = 0.85) {
  gctx.fillStyle = `rgba(${rgb},${alpha})`;
  for (let i = 0; i < 6 + size / 3; i++) {
    const a = rand(0, TAU), d = rand(0, size), r = rand(size * 0.1, size * 0.45);
    gctx.beginPath(); gctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r, 0, TAU); gctx.fill();
  }
}
function burst(x, y, n, color, spd, life, size, dir = null, spread = TAU) {
  for (let i = 0; i < n; i++) {
    const a = dir === null ? rand(0, TAU) : dir + rand(-spread / 2, spread / 2), s = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), max: life, color, size: rand(size * 0.5, size), drag: 4 });
  }
}

// ================== ACTIONS ==================
function curGun() { return player.guns[player.weapon]; }
function switchWeapon(i) {
  if (!player.guns[i].owned || i === player.weapon) return;
  player.weapon = i; player.reloading = 0; player.cooldown = 0.25; sfx.reload();
}
function cycleWeapon() {
  for (let k = 1; k <= WEAPONS.length; k++) { const i = (player.weapon + k) % WEAPONS.length; if (player.guns[i].owned) { switchWeapon(i); return; } }
}
function reload() {
  const g = curGun(), w = WEAPONS[player.weapon];
  if (player.reloading > 0 || g.ammo >= w.mag || g.reserve <= 0) return;
  player.reloading = w.reload; sfx.reload();
}
function shoot() {
  const g = curGun(), w = WEAPONS[player.weapon];
  if (player.cooldown > 0 || player.reloading > 0) return;
  if (g.ammo <= 0) { sfx.empty(); player.cooldown = 0.25; reload(); return; }
  g.ammo--; player.cooldown = w.rate; player.recoil = w.kick;
  const mx = player.x + Math.cos(player.a) * (w.len + 14), my = player.y + Math.sin(player.a) * (w.len + 14);
  for (let i = 0; i < w.pellets; i++) {
    const a = player.a + rand(-w.spread, w.spread) * (w.pellets > 1 ? 1 : 0.5 + player.recoil * 0);
    const sp = w.speed * rand(0.9, 1.05);
    bullets.push({ x: mx, y: my, px: mx, py: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: w.dmg, life: 0.7, pierce: w.pellets > 1 ? 0 : 1 });
  }
  flash = 0.06; shake = Math.max(shake, w.shake);
  burst(mx, my, 6, '255,200,90', 260, 0.12, 3, player.a, 0.6);
  // shell casing
  const sa = player.a + Math.PI / 2;
  particles.push({ x: player.x, y: player.y, vx: Math.cos(sa) * rand(80, 140), vy: Math.sin(sa) * rand(80, 140), life: 0.6, max: 0.6, color: '210,170,70', size: 2.5, drag: 5, casing: true });
  sfx[w.snd]();
  if (g.ammo === 0) reload();
}

// ================== ZOMBIES ==================
function spawnZombie() {
  let x, y, tries = 0;
  const minD = Math.hypot(W, H) / 2 + 80;
  do {
    const a = rand(0, TAU), d = rand(minD, minD + 400);
    x = player.x + Math.cos(a) * d; y = player.y + Math.sin(a) * d; tries++;
  } while ((x < 30 || y < 30 || x > WORLD - 30 || y > WORLD - 30 || pointInObstacle(x, y)) && tries < 40);
  if (tries >= 40) return false;
  const r = Math.random();
  let type = 'walker';
  if (wave >= 4 && r < 0.08 + wave * 0.01) type = 'brute';
  else if (wave >= 2 && r < 0.35) type = 'runner';
  const T = {
    walker: { r: 16, speed: rand(50, 75), hp: 60 + wave * 6, dmg: 10, skin: ['#6f8a5a', '#7d8f63', '#8a9a6a'], cloth: ['#4a3b2e', '#33404a', '#5a4a3a', '#3d3d3d'], score: 10 },
    runner: { r: 14, speed: rand(125, 150), hp: 40 + wave * 4, dmg: 8, skin: ['#9aa07a', '#a3a882'], cloth: ['#5a2a2a', '#2a2a2a'], score: 15 },
    brute: { r: 27, speed: rand(40, 52), hp: 320 + wave * 30, dmg: 25, skin: ['#5a7048'], cloth: ['#2b2b2b', '#3b2a1a'], score: 50 },
  }[type];
  zombies.push({
    x, y, type, r: T.r, speed: T.speed, hp: T.hp, maxHp: T.hp, dmg: T.dmg, score: T.score, a: 0, walk: rand(0, 10), atk: 0, hitT: 0,
    skin: T.skin[Math.floor(rand(0, T.skin.length))], cloth: T.cloth[Math.floor(rand(0, T.cloth.length))], stuck: 0, side: Math.random() < 0.5 ? 1 : -1,
  });
  return true;
}
function killZombie(z, dirA) {
  kills++; score += z.score * wave;
  splat(z.x, z.y, z.r * 1.6);
  burst(z.x, z.y, z.type === 'brute' ? 40 : 22, '150,10,8', 280, 0.6, 4, dirA, 1.6);
  floaters.push({ x: z.x, y: z.y - 20, text: `+${z.score * wave}`, t: 0.9, color: '#f2c14e' });
  const roll = Math.random();
  if (roll < 0.06 + (z.type === 'brute' ? 0.5 : 0)) pickups.push({ x: z.x, y: z.y, type: 'med', t: 20 });
  else if (roll < 0.22) pickups.push({ x: z.x, y: z.y, type: 'ammo', t: 20 });
}

// ================== UPDATE ==================
function update(dt) {
  time += dt;
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }

  // --- player input ---
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) my -= 1;
  if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  let mag = Math.hypot(mx, my);
  if (mag > 0) { mx /= mag; my /= mag; mag = 1; }
  const ms = stickVec(sticks.move);
  if (ms.m > 0) { mx = ms.x; my = ms.y; mag = ms.m; }
  const sprint = (keys.ShiftLeft || keys.ShiftRight || ms.m > 0.95) && mag > 0 && player.stamina > 0.05;
  player.stamina = clamp(player.stamina + (sprint ? -0.45 : 0.25) * dt, 0, 1);
  const spd = player.speed * (sprint ? 1.55 : 1) * mag;
  player.x += mx * spd * dt; player.y += my * spd * dt;
  collideWorld(player);
  if (mag > 0) player.walk += dt * spd * 0.06;

  let firing = false;
  const as = stickVec(sticks.aim);
  if (as.m > 0) { player.a = Math.atan2(as.y, as.x); firing = as.m > 0.35; }
  else if (!isTouch || mouse.down) {
    const sx = mouse.x + cam.x - W / 2, sy = mouse.y + cam.y - H / 2;
    player.a = Math.atan2(sy - player.y, sx - player.x);
    firing = mouse.down;
  } else if (mag > 0) player.a = Math.atan2(my, mx);
  if (keys.Space) firing = true;

  player.cooldown -= dt;
  player.recoil = Math.max(0, player.recoil - dt * 40);
  player.invuln -= dt;
  if (player.reloading > 0) {
    player.reloading -= dt;
    if (player.reloading <= 0) {
      const g = curGun(), w = WEAPONS[player.weapon], need = w.mag - g.ammo, take = Math.min(need, g.reserve);
      g.ammo += take; if (g.reserve !== Infinity) g.reserve -= take; player.reloading = 0;
    }
  }
  if (firing) shoot();

  // --- waves ---
  if (toSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && zombies.length < 45) {
      const batch = Math.min(toSpawn, 1 + Math.floor(wave / 3));
      for (let i = 0; i < batch; i++) if (spawnZombie()) toSpawn--;
      spawnTimer = Math.max(0.35, 1.6 - wave * 0.1) * rand(0.6, 1.3);
    }
  } else if (zombies.length === 0) {
    if (intermission === 0) {
      intermission = 6; showMsg(`ĐÃ SỐNG SÓT ĐÊM ${wave}`, '+25 máu · chuẩn bị đợt tiếp theo');
      player.hp = Math.min(player.maxHp, player.hp + 25);
      score += wave * 100;
    }
    intermission -= dt;
    if (intermission <= 0.0001) nextWave();
  }

  // --- zombies ---
  groanTimer -= dt;
  if (groanTimer <= 0 && zombies.length) { sfx.groan(); groanTimer = rand(1.5, 4); }
  for (let i = 0; i < zombies.length; i++) {
    const z = zombies[i];
    let dx = player.x - z.x, dy = player.y - z.y;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    // stuck avoidance: steer sideways
    if (z.stuck > 0.4) { const sx = -dy * z.side, sy = dx * z.side; dx = dx * 0.3 + sx; dy = dy * 0.3 + sy; z.stuck -= dt * 0.5; if (z.stuck > 1.6) { z.stuck = 0; z.side *= -1; } }
    // separation
    for (let j = i + 1; j < zombies.length; j++) {
      const o = zombies[j], ex = z.x - o.x, ey = z.y - o.y, ed = ex * ex + ey * ey, rr = z.r + o.r;
      if (ed < rr * rr && ed > 0.01) {
        const e = Math.sqrt(ed), p = (rr - e) / 2, nx = ex / e, ny = ey / e;
        z.x += nx * p; z.y += ny * p; o.x -= nx * p; o.y -= ny * p;
      }
    }
    const ox = z.x, oy = z.y;
    const sp = z.speed * (z.hitT > 0 ? 0.35 : 1);
    z.x += dx * sp * dt; z.y += dy * sp * dt;
    if (collideWorld(z)) {
      const moved = Math.hypot(z.x - ox, z.y - oy);
      if (moved < sp * dt * 0.5) z.stuck += dt; else z.stuck = Math.max(0, z.stuck - dt);
    } else z.stuck = Math.max(0, z.stuck - dt);
    const ta = Math.atan2(player.y - z.y, player.x - z.x);
    let da = ta - z.a; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    z.a += da * Math.min(1, dt * 6);
    z.walk += dt * sp * 0.07;
    z.hitT -= dt; z.atk -= dt;
    if (d < z.r + player.r + 4 && z.atk <= 0) {
      z.atk = z.type === 'brute' ? 1.1 : 0.8;
      if (player.invuln <= 0) {
        player.hp -= z.dmg; hurtFlash = 0.35; shake = Math.max(shake, z.type === 'brute' ? 12 : 6); sfx.hurt();
        splat(player.x, player.y, 8, '130,8,6', 0.7);
        player.x -= dx * (z.type === 'brute' ? 26 : 10); player.y -= dy * (z.type === 'brute' ? 26 : 10);
        collideWorld(player);
        if (player.hp <= 0) { gameOver(); return; }
      }
    }
  }

  // --- bullets ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let dead = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WORLD || b.y > WORLD;
    if (!dead && pointInObstacle(b.x, b.y)) {
      dead = true; burst(b.x, b.y, 5, '255,220,150', 180, 0.18, 2); burst(b.x, b.y, 3, '120,120,110', 60, 0.4, 3);
    }
    if (!dead) {
      // segment vs circle
      const sx = b.x - b.px, sy = b.y - b.py, sl = sx * sx + sy * sy;
      for (let j = zombies.length - 1; j >= 0; j--) {
        const z = zombies[j];
        const t = clamp(((z.x - b.px) * sx + (z.y - b.py) * sy) / sl, 0, 1);
        const cx = b.px + sx * t, cy = b.py + sy * t;
        if ((z.x - cx) ** 2 + (z.y - cy) ** 2 < (z.r + 2) ** 2) {
          const a = Math.atan2(b.vy, b.vx);
          z.hp -= b.dmg; z.hitT = 0.12;
          const kb = z.type === 'brute' ? 2 : 7;
          z.x += Math.cos(a) * kb; z.y += Math.sin(a) * kb;
          burst(cx, cy, 6, '170,15,10', 220, 0.35, 3, a, 1.0);
          if (Math.random() < 0.4) splat(cx + Math.cos(a) * 20, cy + Math.sin(a) * 20, 6);
          sfx.hit();
          floaters.push({ x: z.x + rand(-8, 8), y: z.y - z.r, text: b.dmg, t: 0.5, color: '#fff' });
          if (z.hp <= 0) { killZombie(z, a); zombies.splice(j, 1); }
          if (b.pierce-- <= 0) { dead = true; break; }
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }

  // --- pickups ---
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i]; p.t -= dt;
    if (Math.hypot(p.x - player.x, p.y - player.y) < 28) {
      if (p.type === 'med') { player.hp = Math.min(player.maxHp, player.hp + 30); floaters.push({ x: p.x, y: p.y, text: '+30 HP', t: 1, color: '#6fe06f' }); }
      else { player.guns.forEach((g, k) => { if (g.owned && g.reserve !== Infinity) g.reserve += WEAPONS[k].mag; }); floaters.push({ x: p.x, y: p.y, text: 'ĐẠN', t: 1, color: '#f2c14e' }); }
      sfx.pickup(); pickups.splice(i, 1);
    } else if (p.t <= 0) pickups.splice(i, 1);
  }

  // --- particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f;
    p.life -= dt;
    if (p.life <= 0) {
      if (p.casing) { gctx.fillStyle = 'rgba(190,150,60,.8)'; gctx.fillRect(p.x, p.y, 3, 1.5); }
      else if (p.color.startsWith('1') && Math.random() < 0.5) { gctx.fillStyle = 'rgba(110,8,6,.8)'; gctx.beginPath(); gctx.arc(p.x, p.y, p.size * 0.6, 0, TAU); gctx.fill(); }
      particles.splice(i, 1);
    }
  }
  if (particles.length > 600) particles.splice(0, particles.length - 600);
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t -= dt; floaters[i].y -= 30 * dt; if (floaters[i].t <= 0) floaters.splice(i, 1); }

  // --- camera ---
  const lead = isTouch ? 40 : 70;
  const tx = player.x + Math.cos(player.a) * lead, ty = player.y + Math.sin(player.a) * lead;
  cam.x += (tx - cam.x) * Math.min(1, dt * 6); cam.y += (ty - cam.y) * Math.min(1, dt * 6);
  shake = Math.max(0, shake - dt * 30);
  flash -= dt; hurtFlash = Math.max(0, hurtFlash - dt);
}

// ================== DRAW ==================
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function drawObstacle(o) {
  const c = ctx;
  if (o.type === 'building') {
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(o.x + 14, o.y + 14, o.w, o.h);
    const roofs = ['#3b3a37', '#463b33', '#34393d', '#3d3f35'];
    c.fillStyle = roofs[o.hue]; c.fillRect(o.x, o.y, o.w, o.h);
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2;
    for (let y = o.y + 14; y < o.y + o.h; y += 14) { c.beginPath(); c.moveTo(o.x, y); c.lineTo(o.x + o.w, y); c.stroke(); }
    c.strokeStyle = '#1d1d1b'; c.lineWidth = 6; c.strokeRect(o.x + 3, o.y + 3, o.w - 6, o.h - 6);
    c.fillStyle = '#2a2a28'; c.fillRect(o.x + o.w * 0.65, o.y + o.h * 0.2, 30, 26); // AC unit
    c.fillStyle = '#555'; c.beginPath(); c.arc(o.x + o.w * 0.65 + 15, o.y + o.h * 0.2 + 13, 9, 0, TAU); c.fill();
  } else if (o.type === 'car') {
    c.save(); c.translate(o.x + o.w / 2, o.y + o.h / 2); if (!o.horiz) c.rotate(Math.PI / 2);
    const L = 96, Wd = 48;
    c.fillStyle = 'rgba(0,0,0,.5)'; roundRect(c, -L / 2 + 6, -Wd / 2 + 6, L, Wd, 10); c.fill();
    c.fillStyle = '#111'; [[-30, -26], [22, -26], [-30, 20], [22, 20]].forEach(([x, y]) => c.fillRect(x, y, 14, 6));
    c.fillStyle = o.color; roundRect(c, -L / 2, -Wd / 2, L, Wd, 10); c.fill();
    const g = c.createLinearGradient(0, -Wd / 2, 0, Wd / 2); g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(0.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.3)');
    c.fillStyle = g; roundRect(c, -L / 2, -Wd / 2, L, Wd, 10); c.fill();
    c.fillStyle = o.wreck ? '#1a1a1a' : '#1b2630'; roundRect(c, -16, -18, 44, 36, 6); c.fill();
    c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-10, -17, 30, 34);
    c.fillStyle = 'rgba(150,180,200,.25)'; c.fillRect(18, -16, 8, 32);
    if (o.wreck) { c.fillStyle = 'rgba(30,20,10,.6)'; c.beginPath(); c.arc(-25, 5, 14, 0, TAU); c.fill(); }
    c.fillStyle = '#e8e0b0'; c.fillRect(L / 2 - 4, -19, 4, 8); c.fillRect(L / 2 - 4, 11, 4, 8);
    c.fillStyle = '#8a1a14'; c.fillRect(-L / 2, -19, 3, 8); c.fillRect(-L / 2, 11, 3, 8);
    c.restore();
  } else if (o.type === 'crate') {
    c.save(); c.translate(o.x + o.w / 2, o.y + o.h / 2); c.rotate(o.rot);
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(-o.w / 2 + 5, -o.h / 2 + 5, o.w, o.h);
    c.fillStyle = '#7a5a34'; c.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
    c.strokeStyle = '#4e3820'; c.lineWidth = 3; c.strokeRect(-o.w / 2 + 2, -o.h / 2 + 2, o.w - 4, o.h - 4);
    c.beginPath(); c.moveTo(-o.w / 2 + 3, -o.h / 2 + 3); c.lineTo(o.w / 2 - 3, o.h / 2 - 3); c.stroke();
    c.restore();
  } else if (o.type === 'barrel') {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2, r = o.w / 2;
    c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.arc(cx + 5, cy + 5, r, 0, TAU); c.fill();
    const g = c.createRadialGradient(cx - r / 3, cy - r / 3, 2, cx, cy, r); g.addColorStop(0, '#c0582a'); g.addColorStop(1, '#6a2410');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, r * 0.65, 0, TAU); c.stroke();
  } else if (o.type === 'barrier') {
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(o.x + 6, o.y + 6, o.w, o.h);
    c.fillStyle = '#8d8a80'; c.fillRect(o.x, o.y, o.w, o.h);
    c.fillStyle = '#a8a59a'; if (o.w > o.h) c.fillRect(o.x, o.y + 5, o.w, o.h - 10); else c.fillRect(o.x + 5, o.y, o.w - 10, o.h);
    c.fillStyle = '#b8381f';
    const n = Math.floor(Math.max(o.w, o.h) / 30);
    for (let i = 0; i < n; i++) if (o.w > o.h) c.fillRect(o.x + 8 + i * 30, o.y + 5, 12, o.h - 10); else c.fillRect(o.x + 5, o.y + 8 + i * 30, o.w - 10, 12);
  } else if (o.type === 'trunk') {
    c.fillStyle = '#3a2a1a'; c.beginPath(); c.arc(o.x + 9, o.y + 9, 9, 0, TAU); c.fill();
  }
}

function drawHuman(x, y, a, r, walk, opts) {
  const c = ctx;
  c.save(); c.translate(x, y); c.rotate(a);
  const sw = Math.sin(walk) * r * 0.35;
  // shadow
  c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(4, 5, r * 1.05, r * 1.15, 0, 0, TAU); c.fill();
  // feet
  c.fillStyle = '#1a1a1a';
  c.beginPath(); c.ellipse(sw, -r * 0.45, r * 0.35, r * 0.22, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(-sw, r * 0.45, r * 0.35, r * 0.22, 0, 0, TAU); c.fill();
  if (opts.zombie) {
    // outstretched arms
    c.strokeStyle = opts.skin; c.lineWidth = r * 0.36; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -r * 0.7); c.lineTo(r * 1.35 + sw * 0.5, -r * 0.55); c.stroke();
    c.beginPath(); c.moveTo(0, r * 0.7); c.lineTo(r * 1.35 - sw * 0.5, r * 0.5); c.stroke();
    c.strokeStyle = opts.cloth; c.lineWidth = r * 0.42;
    c.beginPath(); c.moveTo(0, -r * 0.7); c.lineTo(r * 0.6, -r * 0.65); c.stroke();
    c.beginPath(); c.moveTo(0, r * 0.7); c.lineTo(r * 0.6, r * 0.65); c.stroke();
  } else {
    // arms holding gun
    const w = opts.weapon, rec = opts.recoil;
    c.fillStyle = '#121212'; c.fillRect(r * 0.55 - rec, -3, w.len + 6, 6);
    c.fillStyle = '#2a2a2a'; c.fillRect(r * 0.55 - rec, -2, w.len, 2);
    if (w.pellets > 1) { c.fillStyle = '#5a3a20'; c.fillRect(r * 0.3 - rec, -3.5, 10, 7); }
    c.strokeStyle = '#3d4a33'; c.lineWidth = r * 0.42; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -r * 0.7); c.lineTo(r * 0.75 - rec, -2); c.stroke();
    c.beginPath(); c.moveTo(0, r * 0.7); c.lineTo(r * 1.0 - rec, 2); c.stroke();
    c.fillStyle = '#c99a78'; c.beginPath(); c.arc(r * 0.8 - rec, -2, r * 0.18, 0, TAU); c.arc(r * 1.05 - rec, 2, r * 0.18, 0, TAU); c.fill();
  }
  // body / shoulders
  c.fillStyle = opts.zombie ? opts.cloth : '#4a5a3c';
  c.beginPath(); c.ellipse(0, 0, r * 0.62, r * 1.0, 0, 0, TAU); c.fill();
  if (!opts.zombie) { c.fillStyle = '#3a2f22'; c.fillRect(-r * 0.6, -r * 0.5, r * 0.35, r); } // backpack
  else { c.fillStyle = 'rgba(90,10,8,.6)'; c.beginPath(); c.arc(r * 0.1, r * 0.25, r * 0.25, 0, TAU); c.fill(); }
  // head
  c.fillStyle = opts.zombie ? opts.skin : '#c99a78';
  c.beginPath(); c.arc(r * 0.08, 0, r * 0.5, 0, TAU); c.fill();
  c.fillStyle = opts.zombie ? 'rgba(40,30,20,.7)' : '#2a1d14';
  c.beginPath(); c.arc(-r * 0.05, 0, r * 0.46, Math.PI * 0.55, Math.PI * 1.45); c.fill();
  if (opts.hit > 0) { c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.globalCompositeOperation = 'source-over'; }
  c.restore();
}

function drawTree(t, alpha) {
  const c = ctx;
  c.save(); c.globalAlpha = alpha;
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(t.x + 18, t.y + 18, t.r, 0, TAU); c.fill();
  const cols = ['#1f3a1c', '#264522', '#2e5228', '#386030'];
  for (let i = 0; i < 4; i++) {
    const rr = t.r * (1 - i * 0.2);
    for (let k = 0; k < 6; k++) {
      const a = t.seed + k * 1.1 + i, d = rr * 0.35;
      c.fillStyle = cols[i]; c.beginPath(); c.arc(t.x + Math.cos(a) * d - i * 3, t.y + Math.sin(a) * d - i * 3, rr * 0.62, 0, TAU); c.fill();
    }
  }
  c.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#050608'; ctx.fillRect(0, 0, W, H);
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const ox = Math.round(W / 2 - cam.x + sx), oy = Math.round(H / 2 - cam.y + sy);
  ctx.save(); ctx.translate(ox, oy);
  // ground (only visible part)
  const vx = clamp(cam.x - W / 2 - 20, 0, WORLD), vy = clamp(cam.y - H / 2 - 20, 0, WORLD);
  const vw = Math.min(W + 40, WORLD - vx), vh = Math.min(H + 40, WORLD - vy);
  if (vw > 0 && vh > 0) ctx.drawImage(ground, vx, vy, vw, vh, vx, vy, vw, vh);
  const vis = (x, y, m) => x > cam.x - W / 2 - m && x < cam.x + W / 2 + m && y > cam.y - H / 2 - m && y < cam.y + H / 2 + m;

  // pickups
  for (const p of pickups) {
    if (!vis(p.x, p.y, 30)) continue;
    const bob = Math.sin(time * 5 + p.x) * 2, blink = p.t < 4 && Math.floor(time * 8) % 2;
    if (blink) continue;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(p.x - 9, p.y - 5, 20, 14);
    if (p.type === 'med') { ctx.fillStyle = '#eee'; ctx.fillRect(p.x - 10, p.y - 8 + bob, 20, 14); ctx.fillStyle = '#d22'; ctx.fillRect(p.x - 2, p.y - 6 + bob, 4, 10); ctx.fillRect(p.x - 6, p.y - 3 + bob, 12, 4); }
    else { ctx.fillStyle = '#4a5a2a'; ctx.fillRect(p.x - 11, p.y - 8 + bob, 22, 14); ctx.fillStyle = '#d4b04a'; for (let i = 0; i < 4; i++) ctx.fillRect(p.x - 8 + i * 5, p.y - 6 + bob, 3, 7); }
  }
  for (const o of obstacles) if (vis(o.x + o.w / 2, o.y + o.h / 2, Math.max(o.w, o.h))) drawObstacle(o);
  // particles (casings & blood under bodies)
  for (const p of particles) {
    ctx.fillStyle = `rgba(${p.color},${clamp(p.life / p.max, 0, 1)})`;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  for (const z of zombies) if (vis(z.x, z.y, 40)) drawHuman(z.x, z.y, z.a, z.r, z.walk, { zombie: true, skin: z.skin, cloth: z.cloth, hit: z.hitT });
  drawHuman(player.x, player.y, player.a, player.r, player.walk, { weapon: WEAPONS[player.weapon], recoil: player.recoil });
  // bullet tracers
  ctx.lineCap = 'round';
  for (const b of bullets) {
    const g = ctx.createLinearGradient(b.px, b.py, b.x, b.y); g.addColorStop(0, 'rgba(255,220,140,0)'); g.addColorStop(1, 'rgba(255,240,190,.95)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.px - (b.x - b.px) * 1.5, b.py - (b.y - b.py) * 1.5); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // tree canopies on top
  for (const t of trees) if (vis(t.x, t.y, t.r + 20)) drawTree(t, Math.hypot(t.x - player.x, t.y - player.y) < t.r ? 0.45 : 1);
  ctx.restore();

  // ---------- LIGHTING ----------
  lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  lctx.globalCompositeOperation = 'source-over';
  lctx.fillStyle = 'rgba(4,6,14,0.86)'; lctx.fillRect(0, 0, W, H);
  lctx.globalCompositeOperation = 'destination-out';
  const px = player.x + ox, py = player.y + oy;
  // ambient around player
  let g = lctx.createRadialGradient(px, py, 0, px, py, 190);
  g.addColorStop(0, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  lctx.fillStyle = g; lctx.beginPath(); lctx.arc(px, py, 190, 0, TAU); lctx.fill();
  // flashlight cone (slight flicker)
  const flick = 0.93 + Math.sin(time * 23) * 0.03 + (Math.random() < 0.01 ? -0.3 : 0);
  const range = 560, half = 0.42;
  g = lctx.createRadialGradient(px, py, 20, px, py, range);
  g.addColorStop(0, `rgba(0,0,0,${flick})`); g.addColorStop(0.6, `rgba(0,0,0,${flick * 0.8})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  lctx.fillStyle = g;
  lctx.beginPath(); lctx.moveTo(px, py);
  lctx.arc(px, py, range, player.a - half, player.a + half); lctx.closePath(); lctx.fill();
  // soft edge cone
  lctx.globalAlpha = 0.4; lctx.beginPath(); lctx.moveTo(px, py); lctx.arc(px, py, range * 0.85, player.a - half * 1.4, player.a + half * 1.4); lctx.closePath(); lctx.fill(); lctx.globalAlpha = 1;
  // muzzle flash light
  if (flash > 0) {
    const fx = px + Math.cos(player.a) * 30, fy = py + Math.sin(player.a) * 30;
    g = lctx.createRadialGradient(fx, fy, 0, fx, fy, 260); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.beginPath(); lctx.arc(fx, fy, 260, 0, TAU); lctx.fill();
  }
  // glowing pickups
  for (const p of pickups) {
    const x = p.x + ox, y = p.y + oy;
    g = lctx.createRadialGradient(x, y, 0, x, y, 40); g.addColorStop(0, 'rgba(0,0,0,.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.beginPath(); lctx.arc(x, y, 40, 0, TAU); lctx.fill();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(light, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // warm flashlight tint + muzzle flash color
  ctx.globalCompositeOperation = 'soft-light';
  g = ctx.createRadialGradient(px, py, 10, px, py, range);
  g.addColorStop(0, 'rgba(255,220,150,.45)'); g.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, range, player.a - half, player.a + half); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  if (flash > 0) {
    const fx = px + Math.cos(player.a) * 32, fy = py + Math.sin(player.a) * 32;
    ctx.globalCompositeOperation = 'lighter';
    g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 40); g.addColorStop(0, 'rgba(255,230,150,.9)'); g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, 40, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  // zombie eyes glow in the dark
  ctx.globalCompositeOperation = 'lighter';
  for (const z of zombies) {
    const x = z.x + ox, y = z.y + oy;
    if (x < -40 || y < -40 || x > W + 40 || y > H + 40) continue;
    const ca = Math.cos(z.a), sa = Math.sin(z.a), e = z.r * 0.4, f = z.r * 0.18;
    ctx.fillStyle = z.type === 'runner' ? 'rgba(255,60,30,.9)' : z.type === 'brute' ? 'rgba(255,150,20,.95)' : 'rgba(220,240,80,.8)';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + ca * e - sa * f * s, y + sa * e + ca * f * s, 1.8, 0, TAU); ctx.fill(); }
  }
  ctx.globalCompositeOperation = 'source-over';
  // health bars for hurt zombies / brutes
  for (const z of zombies) {
    if (z.hp >= z.maxHp && z.type !== 'brute') continue;
    const x = z.x + ox, y = z.y + oy - z.r - 12;
    if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 16, y, 32, 4);
    ctx.fillStyle = '#c9261b'; ctx.fillRect(x - 16, y, 32 * Math.max(0, z.hp / z.maxHp), 4);
  }
  // floaters
  ctx.font = 'bold 14px Segoe UI, Arial'; ctx.textAlign = 'center';
  for (const f of floaters) { ctx.globalAlpha = clamp(f.t * 2, 0, 1); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x + ox, f.y + oy); }
  ctx.globalAlpha = 1;

  // vignette + hurt
  g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const low = player.hp < 30 ? (0.25 + Math.sin(time * 6) * 0.1) : 0;
  if (hurtFlash > 0 || low > 0) {
    g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(150,0,0,0)'); g.addColorStop(1, `rgba(150,0,0,${Math.max(hurtFlash * 1.6, low)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
}

function drawHUD() {
  const c = ctx, m = 16;
  c.textAlign = 'left';
  // HP
  c.fillStyle = 'rgba(0,0,0,.55)'; roundRect(c, m, m, 230, 54, 6); c.fill();
  c.fillStyle = '#e8e2d0'; c.font = 'bold 12px Segoe UI, Arial'; c.fillText('MÁU', m + 12, m + 18);
  c.fillStyle = '#300'; c.fillRect(m + 50, m + 9, 166, 12);
  c.fillStyle = player.hp < 30 ? '#ff3b2f' : '#c9261b'; c.fillRect(m + 50, m + 9, 166 * Math.max(0, player.hp) / player.maxHp, 12);
  c.fillStyle = '#e8e2d0'; c.fillText('THỂ LỰC', m + 12, m + 42);
  c.fillStyle = '#222'; c.fillRect(m + 70, m + 34, 146, 8);
  c.fillStyle = '#d9c56a'; c.fillRect(m + 70, m + 34, 146 * player.stamina, 8);
  // wave & score
  c.textAlign = 'center';
  c.font = 'bold 22px Segoe UI, Arial'; c.fillStyle = '#c9261b'; c.fillText(`ĐÊM ${wave}`, W / 2, m + 22);
  c.font = '13px Segoe UI, Arial'; c.fillStyle = '#e8e2d0';
  const left = toSpawn + zombies.length;
  c.fillText(intermission > 0 ? `Đợt tiếp theo sau ${Math.ceil(intermission)}s` : `Zombie còn lại: ${left}`, W / 2, m + 42);
  c.textAlign = 'right';
  if (!isTouch) { c.font = 'bold 18px Segoe UI, Arial'; c.fillStyle = '#f2c14e'; c.fillText(`${score}`, W - m, m + 20); c.font = '12px Segoe UI, Arial'; c.fillStyle = '#aaa'; c.fillText(`ĐIỂM · ${kills} hạ gục`, W - m, m + 38); }
  else { c.font = 'bold 15px Segoe UI, Arial'; c.fillStyle = '#f2c14e'; c.fillText(`${score}`, W - 66, m + 22); }
  // weapon
  const w = WEAPONS[player.weapon], gun = curGun();
  const bx = isTouch ? m : W - m - 220, by = H - m - 64;
  c.fillStyle = 'rgba(0,0,0,.55)'; roundRect(c, bx, by, 220, 64, 6); c.fill();
  c.textAlign = 'left'; c.fillStyle = '#e8e2d0'; c.font = 'bold 13px Segoe UI, Arial'; c.fillText(w.name, bx + 12, by + 20);
  c.font = 'bold 26px Segoe UI, Arial'; c.fillStyle = gun.ammo === 0 ? '#ff3b2f' : '#fff';
  c.fillText(`${gun.ammo}`, bx + 12, by + 52);
  const aw = c.measureText(`${gun.ammo}`).width;
  c.font = '15px Segoe UI, Arial'; c.fillStyle = '#999'; c.fillText(`/ ${gun.reserve === Infinity ? '∞' : gun.reserve}`, bx + 18 + aw, by + 52);
  // weapon slots
  WEAPONS.forEach((ww, i) => {
    const x = bx + 132 + i * 28, y = by + 10;
    c.fillStyle = i === player.weapon ? '#c9261b' : player.guns[i].owned ? '#444' : '#1a1a1a';
    c.fillRect(x, y, 22, 22); c.fillStyle = player.guns[i].owned ? '#fff' : '#555'; c.font = 'bold 12px Segoe UI'; c.textAlign = 'center'; c.fillText(i + 1, x + 11, y + 16); c.textAlign = 'left';
  });
  if (player.reloading > 0) {
    const p = 1 - player.reloading / w.reload;
    c.fillStyle = '#333'; c.fillRect(bx + 132, by + 42, 78, 6); c.fillStyle = '#f2c14e'; c.fillRect(bx + 132, by + 42, 78 * p, 6);
    c.fillStyle = '#f2c14e'; c.font = '11px Segoe UI'; c.fillText('NẠP ĐẠN', bx + 132, by + 38 + 0);
  }
  // crosshair
  if (!isTouch) {
    const sp = 8 + player.recoil * 2;
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(mouse.x - sp - 6, mouse.y); c.lineTo(mouse.x - sp, mouse.y);
    c.moveTo(mouse.x + sp, mouse.y); c.lineTo(mouse.x + sp + 6, mouse.y);
    c.moveTo(mouse.x, mouse.y - sp - 6); c.lineTo(mouse.x, mouse.y - sp);
    c.moveTo(mouse.x, mouse.y + sp); c.lineTo(mouse.x, mouse.y + sp + 6);
    c.stroke();
  } else {
    for (const k of ['move', 'aim']) {
      const st = sticks[k]; if (!st) continue;
      c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 3; c.beginPath(); c.arc(st.ox, st.oy, 60, 0, TAU); c.stroke();
      c.fillStyle = k === 'aim' ? 'rgba(201,38,27,.6)' : 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(st.x, st.y, 26, 0, TAU); c.fill();
    }
    if (!sticks.move) { c.fillStyle = 'rgba(255,255,255,.18)'; c.font = '13px Segoe UI'; c.textAlign = 'center'; c.fillText('kéo để di chuyển', W * 0.25, H - 110); }
    if (!sticks.aim) { c.fillStyle = 'rgba(255,255,255,.18)'; c.font = '13px Segoe UI'; c.textAlign = 'center'; c.fillText('kéo để ngắm & bắn', W * 0.75, H - 110); }
    for (const b of touchButtons()) {
      c.fillStyle = 'rgba(0,0,0,.5)'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#fff'; c.font = 'bold 18px Segoe UI'; c.textAlign = 'center'; c.fillText(b.label, b.x, b.y + 6);
    }
  }
  // center message
  if (msg) {
    const a = clamp(Math.min(msg.t, 2.4 - msg.t) * 3, 0, 1);
    c.globalAlpha = a; c.textAlign = 'center';
    c.font = `900 ${Math.min(56, W / 10)}px Segoe UI, Arial`; c.fillStyle = '#c9261b';
    c.shadowColor = 'rgba(201,38,27,.7)'; c.shadowBlur = 20;
    c.fillText(msg.title, W / 2, H * 0.32); c.shadowBlur = 0;
    c.font = '16px Segoe UI, Arial'; c.fillStyle = '#e8e2d0'; c.fillText(msg.sub, W / 2, H * 0.32 + 34);
    c.globalAlpha = 1;
  }
  if (state.paused) {
    c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0, 0, W, H);
    c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = '900 42px Segoe UI'; c.fillText('TẠM DỪNG', W / 2, H / 2);
    c.font = '15px Segoe UI'; c.fillText(isTouch ? 'Chạm II để tiếp tục' : 'Nhấn P hoặc Esc để tiếp tục', W / 2, H / 2 + 32);
  }
}

// ================== SCREENS ==================
const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
function bestScore() { try { return +localStorage.getItem('deadnight_best') || 0; } catch (e) { return 0; } }
function saveBest(s) { try { localStorage.setItem('deadnight_best', s); } catch (e) {} }
const helpText = isTouch
  ? 'Ngón trái: di chuyển (kéo hết cỡ để chạy)<br>Ngón phải: ngắm & bắn<br>R: nạp đạn · ⇄: đổi súng'
  : 'WASD: di chuyển · Shift: chạy · Chuột: ngắm & bắn<br>R: nạp đạn · 1/2/3 hoặc Q/lăn chuột: đổi súng · P: tạm dừng';
function startScreen() {
  panel.innerHTML = `<h1>DEAD NIGHT</h1><p class="sub">SINH TỒN QUA TỪNG ĐÊM</p>
    <button id="go">BẮT ĐẦU</button><div class="help">${helpText}<br>Kỷ lục: <b style="color:#f2c14e">${bestScore()}</b></div>`;
  overlay.classList.remove('hidden');
  document.getElementById('go').onclick = begin;
}
function begin() {
  initAudio(); if (ac && ac.state === 'suspended') ac.resume();
  newGame(); overlay.classList.add('hidden'); state.running = true; state.paused = false; mouse.down = false;
}
function gameOver() {
  state.running = false; player.hp = 0;
  const best = Math.max(bestScore(), score); saveBest(best);
  setTimeout(() => {
    panel.innerHTML = `<h1>BẠN ĐÃ CHẾT</h1><div class="stats">Sống sót đến <b>đêm ${wave}</b><br>Hạ gục <b>${kills}</b> zombie<br>Điểm: <b>${score}</b> · Kỷ lục: <b>${best}</b></div>
      <button id="go">CHƠI LẠI</button>`;
    overlay.classList.remove('hidden');
    document.getElementById('go').onclick = begin;
  }, 900);
}

// ================== LOOP ==================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (player) {
    if (state.running && !state.paused) update(dt);
    else if (!state.running) { // death slow-mo: keep particles alive
      for (const p of particles) { p.x += p.vx * dt * 0.3; p.y += p.vy * dt * 0.3; p.life -= dt * 0.3; }
    }
    draw();
  }
  requestAnimationFrame(frame);
}
// attract mode background: generate world behind start screen
newGame(); state.running = false; msg = null;
startScreen();
requestAnimationFrame(frame);
})();
</script>
