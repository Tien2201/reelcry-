<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title th:text="${movie?.name} + ' - Reelcry'"></title>

    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/apple-touch-icon.png(v=2)}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-mark.svg}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/detail.css(v=9)}">
</head>

<body>

    <div th:replace="~{header :: reelcry-header}"></div>
    <div th:if="${notice == 'missing_source'}"
        style="background: rgba(255,193,7,0.12); border: 1px solid rgba(255,193,7,0.35); color: #ffc107; padding: 12px 20px; text-align: center; font-size: 0.9rem;">
        <i class="fas fa-triangle-exclamation"></i>
        Phim này hiện chưa có tập nào xem được, bạn quay lại sau nhé.
    </div>
    <div class="hero-page-wrap">
        <div class="hero-card">
            <div class="hero-bg"
                th:style="|background-image: url('${@img.cdn(movie?.getPosterFull(), 1280)}')|">
            </div>
            <div class="hero-overlay"></div>
            <div class="hero-grain"></div>

            <div class="hero-inner">
                <div class="row align-items-start g-4">
                    <div class="col-lg-7">
                        <span class="hero-tag" th:if="${movie?.quality}"
                            th:text="${movie?.quality} + ' · ' + ${movie?.year}"></span>
                        <span class="hero-rating"
                            th:if="${movie?.tmdb != null and movie.tmdb.vote_average != null and movie.tmdb.vote_average > 0}">
                            <i class="fas fa-star"></i>
                            <span th:text="${#numbers.formatDecimal(movie.tmdb.vote_average, 1, 1)}"></span>
                        </span>

                        <h1 class="hero-title" th:text="${movie?.name}"></h1>
                        <p class="hero-subtitle" th:text="${movie?.origin_name}"></p>

                        <div class="hero-about-label">Nội dung phim</div>
                        <div class="hero-content" th:utext="${movie?.content}"></div>

                        <a class="btn-watch-now" th:if="${episodes != null and !episodes.isEmpty()}"
                            th:href="@{/xem-phim/{slug}(slug=${movie?.slug}, ep=${resumeEpSlug}, sv=${resumeServerIndex != null ? resumeServerIndex : 0}, src=${resumeSource != null ? resumeSource : currentSource})}">
                            <i class="fas fa-play"></i> <span th:text="${resumeEpSlug != null} ? 'Xem tiếp' : 'Xem ngay'">Xem ngay</span>
                        </a>

                        <button type="button" class="btn-favorite" id="btn-favorite"
                            th:classappend="${isFavorite} ? 'active' : ''"
                            th:attr="data-slug=${movie?.slug}, data-name=${movie?.name}, data-source=${currentSource}, data-image=${@img.cdn(movie?.getPosterFull(), 480)}">
                            <i class="fas fa-heart"></i>
                            <span th:text="${isFavorite} ? 'Đã yêu thích' : 'Yêu thích'">Yêu thích</span>
                        </button>

                        <button type="button" class="btn-trailer" th:if="${movie?.getTrailerEmbedId() != null}"
                            data-bs-toggle="modal" data-bs-target="#trailerModal">
                            <i class="fas fa-film"></i> Trailer
                        </button>

                        <div class="hero-socials mt-4">
                            <a href="#" data-share="facebook" aria-label="Chia sẻ lên Facebook"><i class="fab fa-facebook"></i></a>
                            <a href="#" data-share="x" aria-label="Chia sẻ lên X"><i class="fab fa-twitter"></i></a>
                            <a href="#" data-share="native" aria-label="Chia sẻ / sao chép link"><i class="fas fa-share-alt"></i></a>
                        </div>
                    </div>

                    <div class="col-lg-4 offset-lg-1 d-none d-lg-block">
                        <div class="side-panel">
                            <div class="panel-title">Thông tin phim</div>
                            <ul class="info-list">
                                <li th:if="${movie?.time}">
                                    <span class="label">Thời lượng</span>
                                    <span class="value" th:text="${movie?.time}"></span>
                                </li>
                                <li th:if="${movie?.lang}">
                                    <span class="label">Ngôn ngữ</span>
                                    <span class="value" th:text="${movie?.lang}"></span>
                                </li>
                                <li>
                                    <span class="label">Nguồn phim</span>
                                    <span class="value" th:text="${currentSource == 'nguonc'} ? 'NguonC' : 'KKPhim'"></span>
                                </li>
                                <li th:if="${movie?.episode_current}">
                                    <span class="label">Trạng thái</span>
                                    <span class="value" th:text="${movie?.episode_current}"></span>
                                </li>
                                <li th:if="${movie?.country != null and !movie.country.isEmpty()}">
                                    <span class="label">Quốc gia</span>
                                    <span class="value"
                                        th:text="${#strings.listJoin(movie.country.![name], ', ')}"></span>
                                </li>
                                <li th:if="${movie?.actor != null and !movie.actor.isEmpty()}">
                                    <span class="label">Diễn viên</span>
                                    <span class="value" th:text="${#strings.listJoin(movie.actor, ', ')}"></span>
                                </li>
                            </ul>

                            <div class="panel-title" th:text="${resumeEpSlug != null} ? 'Xem tiếp' : 'Xem ngay'">Xem ngay</div>
                            <a class="trailer-thumb" th:if="${episodes != null and !episodes.isEmpty()}"
                                th:href="@{/xem-phim/{slug}(slug=${movie?.slug}, ep=${resumeEpSlug}, sv=${resumeServerIndex != null ? resumeServerIndex : 0}, src=${resumeSource != null ? resumeSource : currentSource})}">
                                <img th:src="${@img.cdn(movie?.getPosterFull(), 480)}" alt="thumbnail">
                                <span class="trailer-play"><i class="fas fa-play"></i></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="genre-tags-section" th:if="${movie?.category != null and !movie.category.isEmpty()}">
        <h3 class="section-heading">Thể loại</h3>
        <div class="genre-tags-row">
            <a class="genre-tag-pill" th:each="cat : ${movie.category}"
                th:href="@{/filter/the-loai/{slug}(slug=${cat.slug})}" th:text="${cat.name}"></a>
        </div>
    </section>

    <section class="server-section-wrap" th:if="${episodes != null and !episodes.isEmpty()}">
        <h3 class="section-heading">Chọn server</h3>
        <div class="d-flex gap-3 flex-wrap server-list">
            <a th:each="server, iter : ${episodes}"
                th:href="@{/xem-phim/{slug}(slug=${movie?.slug}, sv=${iter.index}, src=${currentSource})}"
                class="btn-server">
                <i class="fas fa-play-circle fs-4"></i>
                <span th:text="${server.server_name}"></span>
            </a>
        </div>
    </section>

    <section class="cast-section" th:if="${actors != null and !actors.isEmpty()}">
        <h3 class="section-heading">Diễn viên</h3>
        <div class="cast-row">
            <div class="cast-avatar-item" th:each="p : ${actors}" th:if="${p.name != null and !p.name.isBlank()}">
                <div class="cast-avatar">
                    <img th:if="${p.getProfilePhotoUrl() != null}" th:src="${p.getProfilePhotoUrl()}"
                        th:alt="${p.name}" loading="lazy">
                    <i th:unless="${p.getProfilePhotoUrl() != null}" class="fas fa-user"></i>
                </div>
                <span class="cast-name" th:text="${p.name}"></span>
                <span class="cast-character" th:if="${p.character != null and !p.character.isBlank()}"
                    th:text="${p.character}"></span>
            </div>
        </div>
    </section>

    <section class="director-section" th:if="${movie?.director != null and !movie.director.isEmpty()}">
        <h3 class="section-heading">Đạo diễn</h3>
        <div class="cast-row">
            <div class="cast-avatar-item" th:each="dName : ${movie.director}"
                th:if="${dName != null and !#strings.isEmpty(dName)}"
                th:with="photo=${directorPhotos != null ? directorPhotos[dName] : null}">
                <div class="cast-avatar">
                    <img th:if="${photo != null}" th:src="${photo}" th:alt="${dName}" loading="lazy">
                    <i th:unless="${photo != null}" class="fas fa-user-tie"></i>
                </div>
                <span class="cast-name" th:text="${dName}"></span>
            </div>
        </div>
    </section>

    <section class="related-section" th:if="${relatedMovies != null and !relatedMovies.isEmpty()}">
        <h3 class="section-heading">Có thể bạn thích
            <span class="related-genre-label" th:if="${relatedGenreName}" th:text="'· ' + ${relatedGenreName}"></span>
        </h3>
        <div class="related-grid">
            <a class="related-card" th:each="item : ${relatedMovies}"
                th:href="@{/phim/{slug}(slug=${item.slug}, src=${item.source})}">
                <div class="related-img-wrap">
                    <img th:src="${@img.cdn(item.getImageUrl(), 360)}" th:alt="${item.name}" loading="lazy">
                    <button type="button" class="quick-fav-btn"
                        th:classappend="${favoriteSlugs != null and favoriteSlugs.contains(item.slug)} ? ' active' : ''"
                        th:attr="data-slug=${item.slug}, data-name=${item.name}, data-source=${item.source}, data-image=${@img.cdn(item.getImageUrl(), 360)}"
                        onclick="reelcryQuickFav(event, this)" aria-label="Thêm vào yêu thích">
                        <i th:class="${favoriteSlugs != null and favoriteSlugs.contains(item.slug)} ? 'fas fa-check' : 'fas fa-plus'"></i>
                    </button>
                </div>
                <div class="related-title" th:text="${item.name}"></div>
            </a>
        </div>
    </section>

    <div class="modal fade" id="trailerModal" tabindex="-1" aria-hidden="true" th:if="${movie?.getTrailerEmbedId() != null}">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content trailer-modal-content">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                <div class="ratio ratio-16x9">
                    <iframe id="trailerIframe"
                        th:attr="data-src=@{'https://www.youtube.com/embed/' + ${movie?.getTrailerEmbedId()} + '?autoplay=1'}"
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var trailerModal = document.getElementById('trailerModal');
            var trailerIframe = document.getElementById('trailerIframe');
            if (trailerModal && trailerIframe) {
                trailerModal.addEventListener('show.bs.modal', function () {
                    trailerIframe.src = trailerIframe.dataset.src;
                });
                trailerModal.addEventListener('hidden.bs.modal', function () {
                    trailerIframe.src = '';
                });
            }
        })();

        // Nút chia sẻ: Facebook / X mở cửa sổ chia sẻ thật; nút còn lại dùng
        // bảng chia sẻ của điện thoại, máy tính thì sao chép link vào clipboard
        (function () {
            document.querySelectorAll('[data-share]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var url = location.origin + location.pathname;
                    var type = a.dataset.share;
                    if (type === 'facebook') {
                        window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank', 'noopener,width=620,height=560');
                    } else if (type === 'x') {
                        window.open('https://twitter.com/intent/tweet?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(document.title), '_blank', 'noopener,width=620,height=560');
                    } else if (navigator.share) {
                        navigator.share({ title: document.title, url: url }).catch(function () { });
                    } else if (navigator.clipboard) {
                        navigator.clipboard.writeText(url).then(function () { alert('Đã sao chép link phim!'); });
                    }
                });
            });
        })();

        (function () {
            var btn = document.getElementById('btn-favorite');
            if (!btn) return;

            btn.addEventListener('click', function () {
                var isActive = btn.classList.contains('active');
                var slug = btn.dataset.slug;
                var label = btn.querySelector('span');

                var request = isActive
                    ? fetch('/api/favorites/' + encodeURIComponent(slug), { method: 'DELETE' })
                    : fetch('/api/favorites', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            slug: slug,
                            name: btn.dataset.name,
                            image: btn.dataset.image,
                            source: btn.dataset.source
                        })
                    });

                request.then(function (res) {
                    if (res.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    if (!res.ok) return;
                    btn.classList.toggle('active', !isActive);
                    if (label) label.textContent = !isActive ? 'Đã yêu thích' : 'Yêu thích';
                }).catch(function (e) {
                    console.error('Reelcry favorite toggle error', e);
                });
            });
        })();
    </script>

    <div th:replace="~{footer :: reelcry-footer}"></div>
</body>

</html>
