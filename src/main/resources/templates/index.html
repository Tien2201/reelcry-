<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title th:text="${title != null ? title + ' - Reelcry' : 'Reelcry - Xem Phim Online'}"></title>

    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="apple-touch-icon" th:href="@{/images/icon-192.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/index.css(v=11)}">
</head>

<body>

    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>
    <div class="ambient-glow ambient-glow-3"></div>

    <div th:replace="~{header :: reelcry-header}"></div>

    <section class="home-hero"
        th:if="${searchTerm == null and currentCategory == null and movies != null and !movies.isEmpty()}">
        <div class="hero-slides-wrap" id="heroSlides">
            <div class="hero-slide-item" th:each="movie, iter : ${movies}" th:if="${iter.index < 6}"
                th:classappend="${iter.index == 0} ? ' active' : ''">
                <div class="home-hero-bg"
                    th:style="'background-image: url(/img-proxy?url=' + ${#uris.escapeQueryParam(movie.getImageUrl())} + ')'">
                </div>
                <div class="home-hero-overlay"></div>

                <div class="container home-hero-content">
                    <span class="home-hero-badge"><i class="fas fa-fire"></i> Đang hot</span>
                    <h1 class="home-hero-title" th:text="${movie.name}"></h1>

                    <div class="home-hero-meta">
                        <span th:if="${movie.year != 0}" th:text="${movie.year}"></span>
                        <span th:if="${movie.quality}" th:text="${movie.quality}"></span>
                        <span th:if="${movie.lang}" th:text="${movie.lang}"></span>
                        <span th:if="${movie.episode_current}" th:text="${movie.episode_current}"></span>
                    </div>

                    <div class="home-hero-actions">
                        <a class="btn-hero-play" th:href="@{/phim/{slug}(slug=${movie.slug}, src=${movie.source})}">
                            <i class="fas fa-play"></i> Xem ngay
                        </a>
                        <a class="btn-hero-info" th:href="@{/phim/{slug}(slug=${movie.slug}, src=${movie.source})}">
                            <i class="fas fa-circle-info"></i> Chi tiết
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="hero-coverflow" id="heroCoverflow">
            <div class="cf-item" th:each="movie, iter : ${movies}" th:if="${iter.index < 6}"
                th:attr="data-index=${iter.index}">
                <img th:src="@{/img-proxy(url=${movie.getImageUrl()})}" th:alt="${movie.name}" loading="lazy">
            </div>
        </div>

        <div class="hero-dots" id="heroDots">
            <span class="hero-dot" th:each="movie, iter : ${movies}" th:if="${iter.index < 6}"
                th:classappend="${iter.index == 0} ? ' active' : ''" th:attr="data-index=${iter.index}"></span>
        </div>

        <button class="hero-arrow hero-arrow-left" id="heroPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="hero-arrow hero-arrow-right" id="heroNext"><i class="fas fa-chevron-right"></i></button>
    </section>

    <div class="container my-5">

        <div id="watched-section"
            th:if="${searchTerm == null and currentCategory == null and watchHistory != null and !watchHistory.isEmpty()}">
            <div class="section-title-row">
                <h2 class="section-title">Đang Xem / Đã Xem</h2>
                <button class="section-viewall" id="clear-history-btn">Xoá lịch sử <i class="fas fa-trash"></i></button>
            </div>
            <div class="vn-row-wrap">
                <button class="vn-arrow vn-arrow-left" type="button" aria-label="Cuộn trái"><i
                        class="fas fa-chevron-left"></i></button>
                <div class="vn-row-inner">
                    <div class="vn-scroll-row">
                        <div class="vn-card-wrap watched-card-wrap" th:each="h : ${watchHistory}" th:attr="data-slug=${h.movieSlug}">
                            <a th:href="@{/xem-phim/{slug}(slug=${h.movieSlug}, ep=${h.epSlug}, sv=${h.serverIndex}, src=${h.source})}" class="text-decoration-none">
                                <div class="movie-card watched-card watched-card-v2">
                                    <div class="movie-img-container">
                                        <img th:src="${h.movieImage}" th:alt="${h.movieName}" loading="lazy">
                                        <div class="movie-card-gradient"></div>
                                        <div class="watched-play-btn watched-play-btn-v2"><i class="fas fa-play"></i></div>
                                    </div>
                                    <div class="watch-progress-bar" th:if="${h.progressPercent != null}"
                                        th:title="|Đã xem ${h.progressPercent}%|">
                                        <div class="watch-progress-bar-fill" th:style="'width:' + ${h.progressPercent} + '%'"></div>
                                    </div>
                                    <div class="movie-info">
                                        <div class="movie-title" th:text="${h.movieName}"></div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="vn-custom-scrollbar">
                        <div class="vn-custom-scrollbar-thumb"></div>
                    </div>
                </div>
                <button class="vn-arrow vn-arrow-right" type="button" aria-label="Cuộn phải"><i
                        class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div id="favorites-section"
            th:if="${searchTerm == null and currentCategory == null and favorites != null and !favorites.isEmpty()}">
            <div class="section-title-row">
                <h2 class="section-title">Phim Yêu Thích</h2>
                <button class="section-viewall" id="clear-favorites-btn">Xoá yêu thích <i
                        class="fas fa-trash"></i></button>
            </div>
            <div class="vn-row-wrap">
                <button class="vn-arrow vn-arrow-left" type="button" aria-label="Cuộn trái"><i
                        class="fas fa-chevron-left"></i></button>
                <div class="vn-row-inner">
                    <div class="vn-scroll-row" id="favorites-row">
                        <div class="vn-card-wrap favorite-card-wrap" th:each="f : ${favorites}" th:attr="data-slug=${f.movieSlug}">
                            <a th:href="@{/phim/{slug}(slug=${f.movieSlug}, src=${f.source})}" class="text-decoration-none">
                                <div class="movie-card">
                                    <div class="movie-img-container">
                                        <img th:src="${f.movieImage}" th:alt="${f.movieName}" loading="lazy">
                                        <div class="movie-card-gradient"></div>
                                        <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                                    </div>
                                    <div class="movie-info">
                                        <div class="movie-title" th:text="${f.movieName}"></div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="vn-custom-scrollbar">
                        <div class="vn-custom-scrollbar-thumb"></div>
                    </div>
                </div>
                <button class="vn-arrow vn-arrow-right" type="button" aria-label="Cuộn phải"><i
                        class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div th:if="${searchTerm == null and currentCategory == null and moviesAnime != null and !moviesAnime.isEmpty()}">
            <div class="section-title-row">
                <h2 class="section-title">Phim Hoạt Hình</h2>
                <a class="section-viewall" th:href="@{/filter/danh-sach/hoat-hinh}">Xem tất cả <i
                        class="fas fa-chevron-right"></i></a>
            </div>
            <div class="vn-row-wrap">
                <button class="vn-arrow vn-arrow-left" type="button" aria-label="Cuộn trái"><i
                        class="fas fa-chevron-left"></i></button>
                <div class="vn-row-inner">
                    <div class="vn-scroll-row">
                        <div class="vn-card-wrap" th:each="movie : ${moviesAnime}">
                            <a th:href="@{/phim/{slug}(slug=${movie.slug}, src=${movie.source})}" class="text-decoration-none">
                                <div class="movie-card">
                                    <span class="badge-status" th:text="${movie?.episode_current ?: 'HD'}"></span>
                                    <span class="badge-year" th:text="${movie?.year}"></span>
                                    <div class="movie-img-container">
                                        <img th:src="@{/img-proxy(url=${movie.getImageUrl()})}" th:alt="${movie.name}" loading="lazy">
                                        <div class="movie-card-gradient"></div>
                                        <button type="button" class="quick-fav-btn"
                                            th:classappend="${favoriteSlugs != null and favoriteSlugs.contains(movie.slug)} ? ' active' : ''"
                                            th:attr="data-slug=${movie.slug}, data-name=${movie.name}, data-source=${movie.source}, data-image=@{/img-proxy(url=${movie.getImageUrl()})}"
                                            onclick="reelcryQuickFav(event, this)" aria-label="Thêm vào yêu thích">
                                            <i th:class="${favoriteSlugs != null and favoriteSlugs.contains(movie.slug)} ? 'fas fa-check' : 'fas fa-plus'"></i>
                                        </button>
                                        <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                                    </div>
                                    <div class="movie-info">
                                        <div class="movie-title" th:text="${movie.name}"></div>
                                        <div class="movie-hover-meta"
                                            th:text="${(movie?.quality ?: '') + ' · ' + (movie?.lang ?: '')}"></div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="vn-custom-scrollbar">
                        <div class="vn-custom-scrollbar-thumb"></div>
                    </div>
                </div>
                <button class="vn-arrow vn-arrow-right" type="button" aria-label="Cuộn phải"><i
                        class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div
            th:if="${searchTerm == null and currentCategory == null and moviesCinema != null and !moviesCinema.isEmpty()}">
            <div class="section-title-row">
                <h2 class="section-title">Phim Chiếu Rạp</h2>
                <a class="section-viewall" th:href="@{/filter/danh-sach/phim-chieu-rap}">Xem tất cả <i
                        class="fas fa-chevron-right"></i></a>
            </div>
            <div class="vn-row-wrap">
                <button class="vn-arrow vn-arrow-left" type="button" aria-label="Cuộn trái"><i
                        class="fas fa-chevron-left"></i></button>
                <div class="vn-row-inner">
                    <div class="vn-scroll-row">
                        <div class="vn-card-wrap" th:each="movie : ${moviesCinema}">
                            <a th:href="@{/phim/{slug}(slug=${movie.slug}, src=${movie.source})}" class="text-decoration-none">
                                <div class="movie-card">
                                    <span class="badge-status" th:text="${movie?.episode_current ?: 'HD'}"></span>
                                    <span class="badge-year" th:text="${movie?.year}"></span>
                                    <div class="movie-img-container">
                                        <img th:src="@{/img-proxy(url=${movie.getImageUrl()})}" th:alt="${movie.name}" loading="lazy">
                                        <div class="movie-card-gradient"></div>
                                        <button type="button" class="quick-fav-btn"
                                            th:classappend="${favoriteSlugs != null and favoriteSlugs.contains(movie.slug)} ? ' active' : ''"
                                            th:attr="data-slug=${movie.slug}, data-name=${movie.name}, data-source=${movie.source}, data-image=@{/img-proxy(url=${movie.getImageUrl()})}"
                                            onclick="reelcryQuickFav(event, this)" aria-label="Thêm vào yêu thích">
                                            <i th:class="${favoriteSlugs != null and favoriteSlugs.contains(movie.slug)} ? 'fas fa-check' : 'fas fa-plus'"></i>
                                        </button>
                                        <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                                    </div>
                                    <div class="movie-info">
                                        <div class="movie-title" th:text="${movie.name}"></div>
                                        <div class="movie-hover-meta"
                                            th:text="${(movie?.quality ?: '') + ' · ' + (movie?.lang ?: '')}"></div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="vn-custom-scrollbar">
                        <div class="vn-custom-scrollbar-thumb"></div>
                    </div>
                </div>
                <button class="vn-arrow vn-arrow-right" type="button" aria-label="Cuộn phải"><i
                        class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="section-title-row">
            <h2 class="section-title">Thể loại</h2>
        </div>
        <div class="vn-row-wrap genre-pill-wrap">
            <button class="vn-arrow vn-arrow-left" type="button" aria-label="Cuộn trái"><i
                    class="fas fa-chevron-left"></i></button>
            <div class="vn-row-inner">
                <div class="vn-scroll-row genre-pill-row">
                    <a class="genre-pill" th:each="g : ${allGenres}"
                        th:href="@{/filter/the-loai/{slug}(slug=${g.slug})}"
                        th:classappend="${currentCategory == 'the-loai' and currentSlug == g.slug} ? ' active' : ''"
                        th:text="${g.name}"></a>
                </div>
            </div>
            <button class="vn-arrow vn-arrow-right" type="button" aria-label="Cuộn phải"><i
                    class="fas fa-chevron-right"></i></button>
        </div>

        <div class="section-title-row">
            <h2 class="section-title" th:text="${title != null ? title : 'Phim Mới Cập Nhật'}"></h2>
        </div>

        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-6 g-3 g-md-4">
            <div class="col" th:each="movie, iter : ${movies}"
                th:if="${!(searchTerm == null and currentCategory == null and iter.index == 0)}">
                <a th:href="@{/phim/{slug}(slug=${movie.slug}, src=${movie.source})}" class="text-decoration-none">
                    <div class="movie-card">
                        <span class="badge-status" th:text="${movie?.episode_current ?: 'HD'}"></span>
                        <span class="badge-year" th:text="${movie?.year}"></span>

                        <div class="movie-img-container">
                            <img th:src="@{/img-proxy(url=${movie.getImageUrl()})}" th:alt="${movie.name}"
                                onerror="this.onerror=null;this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iNDUwIiB2aWV3Qm94PSIwIDAgMzAwIDQ1MCI+PHJlY3Qgd2lkdGg9IjMwMCIgaGVpZ2h0PSI0NTAiIGZpbGw9IiMxZTFlMWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiM3NzciIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5LaMO0bmcgY8OzIOG6o25oPC90ZXh0Pjwvc3ZnPg=='"
                                loading="lazy">
                            <div class="movie-card-gradient"></div>
                            <button type="button" class="quick-fav-btn"
                                th:classappend="${favoriteSlugs != null and favoriteSlugs.contains(movie.slug)} ? ' active' : ''"
                                th:attr="data-slug=${movie.slug}, data-name=${movie.name}, data-source=${movie.source}, data-image=@{/img-proxy(url=${movie.getImageUrl()})}"
                                onclick="reelcryQuickFav(event, this)" aria-label="Thêm vào yêu thích">
                                <i th:class="${favoriteSlugs != null and favoriteSlugs.contains(movie.slug)} ? 'fas fa-check' : 'fas fa-plus'"></i>
                            </button>
                            <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                        </div>

                        <div class="movie-info">
                            <div class="movie-title" th:text="${movie.name}"></div>
                            <div class="movie-hover-meta"
                                th:text="${(movie?.quality ?: '') + ' · ' + (movie?.lang ?: '')}"></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <nav class="mt-5" th:if="${currentPage != null}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link"
                        th:href="${currentCategory != null} ? @{/filter/{cat}/{slug}(cat=${currentCategory}, slug=${currentSlug}, page=${currentPage - 1})} : @{/(page=${currentPage - 1})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>

                <li class="page-item active">
                    <span class="page-link" th:text="${currentPage}"></span>
                </li>

                <li class="page-item">
                    <a class="page-link"
                        th:href="${currentCategory != null} ? @{/filter/{cat}/{slug}(cat=${currentCategory}, slug=${currentSlug}, page=${currentPage + 1})} : @{/(page=${currentPage + 1})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="modal fade" id="deleteChecklistModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content delete-checklist-modal">
                <div class="delete-checklist-glow"></div>
                <div class="modal-header">
                    <div class="delete-checklist-heading">
                        <span class="delete-checklist-icon"><i class="fas fa-trash-can"></i></span>
                        <div>
                            <h5 class="modal-title" id="deleteChecklistTitle">Chọn phim muốn xoá</h5>
                            <span class="delete-checklist-subtitle">Tích chọn phim rồi xác nhận xoá</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="delete-checklist-toolbar">
                        <label class="delete-checklist-selectall">
                            <input type="checkbox" id="deleteChecklistSelectAll">
                            <span class="check-visual"><i class="fas fa-check"></i></span>
                            Chọn tất cả
                        </label>
                        <span class="delete-checklist-count" id="deleteChecklistCount">0 đã chọn</span>
                    </div>
                    <div id="deleteChecklistList" class="delete-checklist-list"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel-delete" data-bs-dismiss="modal">Huỷ</button>
                    <button type="button" class="btn-confirm-delete" id="deleteChecklistConfirm" disabled>
                        <i class="fas fa-trash-can"></i> <span id="deleteChecklistConfirmLabel">Xoá đã chọn</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var modalEl = document.getElementById('deleteChecklistModal');
            if (!modalEl) return;

            var modal = null;
            function getModal() {
                if (!modal && typeof bootstrap !== 'undefined') modal = new bootstrap.Modal(modalEl);
                return modal;
            }

            var titleEl = document.getElementById('deleteChecklistTitle');
            var listEl = document.getElementById('deleteChecklistList');
            var selectAllEl = document.getElementById('deleteChecklistSelectAll');
            var confirmBtn = document.getElementById('deleteChecklistConfirm');
            var confirmLabel = document.getElementById('deleteChecklistConfirmLabel');
            var countEl = document.getElementById('deleteChecklistCount');
            var currentConfig = null;

            function updateConfirmState() {
                var boxes = listEl.querySelectorAll('.delete-checklist-checkbox');
                var checked = listEl.querySelectorAll('.delete-checklist-checkbox:checked');
                confirmBtn.disabled = checked.length === 0;
                selectAllEl.checked = boxes.length > 0 && checked.length === boxes.length;
                countEl.textContent = checked.length + ' đã chọn';
                countEl.classList.toggle('has-selection', checked.length > 0);
            }

            function openChecklist(config) {
                var m = getModal();
                if (!m) return;
                currentConfig = config;
                titleEl.textContent = config.title;
                listEl.innerHTML = '';
                selectAllEl.checked = false;

                var cards = document.querySelectorAll(config.cardSelector);

                cards.forEach(function (card, index) {
                    var slug = card.dataset.slug;
                    if (!slug) return;
                    var img = card.querySelector('img');
                    var name = card.querySelector('.movie-title');

                    var item = document.createElement('label');
                    item.className = 'delete-checklist-item';
                    item.style.setProperty('--i', index);

                    var checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'delete-checklist-checkbox';
                    checkbox.value = slug;

                    var checkVisual = document.createElement('span');
                    checkVisual.className = 'check-visual';
                    checkVisual.innerHTML = '<i class="fas fa-check"></i>';

                    var thumb = document.createElement('img');
                    thumb.className = 'delete-checklist-thumb';
                    thumb.src = img ? img.src : '';
                    thumb.alt = '';

                    var label = document.createElement('span');
                    label.className = 'delete-checklist-name';
                    label.textContent = name ? name.textContent : slug;

                    item.appendChild(checkbox);
                    item.appendChild(checkVisual);
                    item.appendChild(thumb);
                    item.appendChild(label);
                    listEl.appendChild(item);
                });

                if (!cards.length) {
                    var empty = document.createElement('div');
                    empty.className = 'delete-checklist-empty';
                    empty.textContent = 'Không có phim nào.';
                    listEl.appendChild(empty);
                }

                updateConfirmState();
                m.show();
            }

            listEl.addEventListener('change', function (e) {
                if (!e.target.classList.contains('delete-checklist-checkbox')) return;
                var item = e.target.closest('.delete-checklist-item');
                if (item) item.classList.toggle('is-checked', e.target.checked);
                updateConfirmState();
            });

            selectAllEl.addEventListener('change', function () {
                listEl.querySelectorAll('.delete-checklist-checkbox').forEach(function (b) {
                    b.checked = selectAllEl.checked;
                    var item = b.closest('.delete-checklist-item');
                    if (item) item.classList.toggle('is-checked', selectAllEl.checked);
                });
                updateConfirmState();
            });

            confirmBtn.addEventListener('click', function () {
                if (!currentConfig) return;
                var checked = listEl.querySelectorAll('.delete-checklist-checkbox:checked');
                var slugs = Array.prototype.map.call(checked, function (b) { return b.value; });
                if (slugs.length === 0) return;

                confirmBtn.disabled = true;
                confirmBtn.classList.add('is-loading');
                confirmLabel.textContent = 'Đang xoá...';

                fetch(currentConfig.endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slugs: slugs })
                }).then(function (res) {
                    if (res.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    if (!res.ok) throw new Error('Xoá thất bại');

                    slugs.forEach(function (slug) {
                        document.querySelectorAll(currentConfig.cardSelector).forEach(function (card) {
                            if (card.dataset.slug === slug) {
                                card.classList.add('card-removing');
                                setTimeout(function () { card.remove(); }, 260);
                            }
                        });
                    });

                    setTimeout(function () {
                        if (document.querySelectorAll(currentConfig.cardSelector).length === 0) {
                            var sectionWrap = document.getElementById(currentConfig.sectionWrapId);
                            if (sectionWrap) sectionWrap.remove();
                        }
                    }, 280);

                    var m = getModal();
                    if (m) m.hide();
                }).catch(function (e) {
                    console.error('Xoá phim đã chọn lỗi', e);
                    alert('Xoá thất bại, vui lòng thử lại.');
                }).finally(function () {
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('is-loading');
                    confirmLabel.textContent = 'Xoá đã chọn';
                });
            });

            var historyBtn = document.getElementById('clear-history-btn');
            if (historyBtn) {
                historyBtn.addEventListener('click', function () {
                    openChecklist({
                        title: 'Chọn phim muốn xoá khỏi lịch sử',
                        endpoint: '/api/history/delete-selected',
                        cardSelector: '.watched-card-wrap',
                        sectionWrapId: 'watched-section'
                    });
                });
            }

            var favoritesBtn = document.getElementById('clear-favorites-btn');
            if (favoritesBtn) {
                favoritesBtn.addEventListener('click', function () {
                    openChecklist({
                        title: 'Chọn phim muốn xoá khỏi yêu thích',
                        endpoint: '/api/favorites/delete-selected',
                        cardSelector: '.favorite-card-wrap',
                        sectionWrapId: 'favorites-section'
                    });
                });
            }
        })();
    </script>
    <script>
        (function () {
            if (!('IntersectionObserver' in window)) {
                document.querySelectorAll('.movie-card').forEach(function (el) { el.classList.add('reveal'); });
                return;
            }
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

            document.querySelectorAll('.movie-card').forEach(function (el) {
                observer.observe(el);
            });
        })();
    </script>
    <script>
        (function () {
            var slides = document.querySelectorAll('.hero-slide-item');
            var dots = document.querySelectorAll('.hero-dot');
            var cfItems = document.querySelectorAll('.cf-item');
            if (slides.length <= 1) return;

            var current = 0;
            var timer;

            function updateCoverflow(idx) {
                var total = cfItems.length;
                if (!total) return;
                cfItems.forEach(function (item, i) {
                    var diff = i - idx;
                    if (diff > total / 2) diff -= total;
                    if (diff < -total / 2) diff += total;

                    if (diff >= -2 && diff <= 2) {
                        item.setAttribute('data-offset', diff);
                    } else {
                        item.setAttribute('data-offset', 'hidden');
                    }
                });
            }

            function show(idx) {
                slides[current].classList.remove('active');
                if (dots[current]) dots[current].classList.remove('active');
                current = (idx + slides.length) % slides.length;
                slides[current].classList.add('active');
                if (dots[current]) dots[current].classList.add('active');
                updateCoverflow(current);
            }

            function startAutoplay() {
                clearInterval(timer);
                timer = setInterval(function () { show(current + 1); }, 6500);
            }

            document.getElementById('heroNext').addEventListener('click', function () {
                show(current + 1); startAutoplay();
            });
            document.getElementById('heroPrev').addEventListener('click', function () {
                show(current - 1); startAutoplay();
            });
            dots.forEach(function (dot, i) {
                dot.addEventListener('click', function () { show(i); startAutoplay(); });
            });
            cfItems.forEach(function (item, i) {
                item.addEventListener('click', function () { show(i); startAutoplay(); });
            });

            updateCoverflow(0);
            startAutoplay();
        })();
    </script>
    <script>
        (function () {
            var scrollbars = []; // { row, track, thumb }

            function updateThumb(sb) {
                var row = sb.row, track = sb.track, thumb = sb.thumb;
                var trackWidth = track.clientWidth;
                var scrollable = row.scrollWidth - row.clientWidth;

                if (scrollable <= 1) {
                    track.style.visibility = 'hidden';
                    return;
                }
                track.style.visibility = 'visible';

                var thumbWidth = Math.max((row.clientWidth / row.scrollWidth) * trackWidth, 30);
                var maxThumbLeft = trackWidth - thumbWidth;
                var ratio = row.scrollLeft / scrollable;
                var thumbLeft = maxThumbLeft * ratio;

                thumb.style.width = thumbWidth + 'px';
                thumb.style.left = thumbLeft + 'px';

                updateFade(row);
            }

            function updateFade(row) {
                var inner = row.closest('.vn-row-inner');
                if (!inner) return;
                var maxScroll = row.scrollWidth - row.clientWidth;
                inner.classList.toggle('fade-left', row.scrollLeft > 4);
                inner.classList.toggle('fade-right', row.scrollLeft < maxScroll - 4);
            }

            function wireRow(row) {
                if (!row || row.dataset.vnWired) return;
                row.dataset.vnWired = '1';

                var rafId = null;

                row.addEventListener('wheel', function (e) {
                    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // để trình duyệt tự xử lý cuộn ngang (trackpad)

                    e.preventDefault();

                    var maxScroll = row.scrollWidth - row.clientWidth;
                    var next = row.scrollLeft + e.deltaY * 1.1;
                    next = Math.max(0, Math.min(maxScroll, next));

                    if (rafId) cancelAnimationFrame(rafId);

                    var start = row.scrollLeft;
                    var startTime = null;
                    var duration = 380;

                    function step(ts) {
                        if (!startTime) startTime = ts;
                        var progress = Math.min((ts - startTime) / duration, 1);
                        var eased = 1 - Math.pow(1 - progress, 4); // ease-out quart, mượt & êm hơn
                        row.scrollLeft = start + (next - start) * eased;
                        if (progress < 1) {
                            rafId = requestAnimationFrame(step);
                        } else {
                            rafId = null;
                        }
                    }
                    rafId = requestAnimationFrame(step);
                }, { passive: false });
            }

            function wireDragScroll(row) {
                if (!row || row.dataset.vnDragWired) return;
                row.dataset.vnDragWired = '1';

                var isDown = false;
                var moved = false;
                var startX = 0;
                var startScroll = 0;

                row.addEventListener('mousedown', function (e) {
                    isDown = true;
                    moved = false;
                    startX = e.pageX;
                    startScroll = row.scrollLeft;
                });

                document.addEventListener('mousemove', function (e) {
                    if (!isDown) return;
                    var dx = e.pageX - startX;
                    if (Math.abs(dx) > 5 && !moved) {
                        moved = true;
                        row.classList.add('dragging-row');
                    }
                    if (moved) {
                        row.scrollLeft = startScroll - dx;
                    }
                });

                document.addEventListener('mouseup', function () {
                    if (!isDown) return;
                    isDown = false;
                    if (moved) {
                        row.classList.remove('dragging-row');
                        var suppressClick = function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                        };
                        row.addEventListener('click', suppressClick, { capture: true, once: true });
                    }
                });
            }

            function wireCustomScrollbar(row, track) {
                if (!track || track.dataset.vnWired) return;
                track.dataset.vnWired = '1';

                var thumb = track.querySelector('.vn-custom-scrollbar-thumb');
                if (!thumb) return;

                var sb = { row: row, track: track, thumb: thumb };
                scrollbars.push(sb);

                row.addEventListener('scroll', function () { updateThumb(sb); });

                var dragging = false;
                var startX = 0;
                var startScrollLeft = 0;

                function onDragMove(e) {
                    if (!dragging) return;
                    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    var trackWidth = track.clientWidth;
                    var thumbWidth = thumb.clientWidth;
                    var scrollable = row.scrollWidth - row.clientWidth;
                    var trackScrollable = trackWidth - thumbWidth;
                    if (trackScrollable <= 0 || scrollable <= 0) return;
                    var deltaX = clientX - startX;
                    row.scrollLeft = startScrollLeft + (deltaX / trackScrollable) * scrollable;
                }

                function stopDrag() {
                    if (!dragging) return;
                    dragging = false;
                    track.classList.remove('dragging');
                    document.body.style.userSelect = '';
                }

                thumb.addEventListener('mousedown', function (e) {
                    dragging = true;
                    startX = e.clientX;
                    startScrollLeft = row.scrollLeft;
                    track.classList.add('dragging');
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                });
                thumb.addEventListener('touchstart', function (e) {
                    dragging = true;
                    startX = e.touches[0].clientX;
                    startScrollLeft = row.scrollLeft;
                    track.classList.add('dragging');
                }, { passive: true });

                document.addEventListener('mousemove', onDragMove);
                document.addEventListener('touchmove', onDragMove, { passive: true });
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);

                track.addEventListener('click', function (e) {
                    if (e.target === thumb) return;
                    var rect = track.getBoundingClientRect();
                    var clickRatio = (e.clientX - rect.left) / rect.width;
                    var scrollable = row.scrollWidth - row.clientWidth;
                    row.scrollTo({ left: clickRatio * scrollable, behavior: 'smooth' });
                });

                updateThumb(sb);
            }

            function wireWrap(wrap) {
                var row = wrap.querySelector('.vn-scroll-row');
                var track = wrap.querySelector('.vn-custom-scrollbar');
                var btnLeft = wrap.querySelector('.vn-arrow-left');
                var btnRight = wrap.querySelector('.vn-arrow-right');
                if (!row) return;

                wireRow(row);
                wireDragScroll(row);
                wireCustomScrollbar(row, track);

                function scrollByAmount(dir) {
                    var amount = row.clientWidth * 0.85 || 300;
                    row.scrollBy({ left: dir * amount, behavior: 'smooth' });
                }

                if (btnLeft) btnLeft.addEventListener('click', function () { scrollByAmount(-1); });
                if (btnRight) btnRight.addEventListener('click', function () { scrollByAmount(1); });
            }

            document.querySelectorAll('.vn-row-wrap').forEach(wireWrap);

            window.addEventListener('resize', function () {
                scrollbars.forEach(updateThumb);
            });

            // Một số hàng (VD: mục yêu thích) có thể đổi nội dung động sau khi trang tải,
            // observe để gắn listener lại và cập nhật thanh cuộn khi nội dung đổi sau đó.
            var mo = new MutationObserver(function () {
                document.querySelectorAll('.vn-scroll-row').forEach(wireRow);
                scrollbars.forEach(updateThumb);
            });
            mo.observe(document.body, { childList: true, subtree: true });
        })();
    </script>
